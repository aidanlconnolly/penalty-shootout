<!doctype html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Penalty Shoot-out</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a1424;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
#app{position:relative;width:100vw;height:100dvh;min-height:100vh;overflow:hidden;}
#stage{position:absolute;inset:0;touch-action:none;}
button{touch-action:manipulation;}
body.shake #stage{animation:shake 220ms ease-out;}
@keyframes shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-3px,1px);}40%{transform:translate(3px,-1px);}60%{transform:translate(-2px,2px);}80%{transform:translate(2px,-2px);}}

/* main scene SVG fills screen */
#scene{position:absolute;inset:0;width:100%;height:100%;}

/* SVG keeper transform — inner group gets the delta, wrapper stays at base pos */
#keeper{
  transform-box:fill-box;
  transform-origin:50% 78%;
  transition:transform 320ms cubic-bezier(.2,.85,.3,1);
}
#scene.dragmode{cursor:grab;}
#scene.dragmode:active{cursor:grabbing;}

/* ── SCOREBOARD HUD (top, stadium-style) ── */
.scoreboard{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;
  background:linear-gradient(to bottom,#16181c 0%,#0a0c10 100%);
  border:2px solid #3a3a3a;border-top-color:#5a5a5a;border-radius:10px;padding:10px 22px;z-index:10;pointer-events:none;
  box-shadow:inset 0 0 16px rgba(255,180,40,0.08),0 6px 24px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.04);}
.scoreboard::before,.scoreboard::after{content:'';width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff3333,#660000);box-shadow:0 0 6px rgba(255,80,80,0.8);position:absolute;top:50%;transform:translateY(-50%);}
.scoreboard::before{left:-15px;} .scoreboard::after{right:-15px;}
.tm{display:flex;align-items:center;gap:10px;font-family:'Courier New',Menlo,monospace;color:#ffc857;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px;text-shadow:0 0 6px rgba(255,200,80,0.5);}
.tm .flag{font-size:18px;text-shadow:none;}
.dots{display:flex;gap:5px;}
.dot{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,0.18);border:1.5px solid rgba(0,0,0,0.4);}
.dot.g{background:#22c55e;box-shadow:0 0 6px #22c55e,inset 0 0 3px rgba(255,255,255,0.5);border-color:#16a34a;}
.dot.m{background:#ef4444;box-shadow:0 0 6px #ef4444,inset 0 0 3px rgba(255,255,255,0.5);border-color:#b91c1c;}
.vs{color:#ffc857;font-weight:900;font-family:'Courier New',monospace;font-size:16px;letter-spacing:3px;text-shadow:0 0 8px rgba(255,200,80,0.6);}

#banner{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:6px 18px;border-radius:18px;font-size:12px;letter-spacing:2px;text-transform:uppercase;z-index:10;pointer-events:none;white-space:nowrap;border:1px solid rgba(255,200,80,0.3);}

/* power meter */
#powerWrap{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.65);border-radius:14px;padding:10px 16px;z-index:10;pointer-events:none;text-align:center;border:1px solid rgba(255,200,80,0.3);}
#powerWrap .lbl{color:rgba(255,200,80,0.8);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-family:'Courier New',monospace;font-weight:700;}
.bar-v{position:relative;width:22px;height:80px;background:linear-gradient(0deg,#a3e635,#facc15 40%,#f97316 70%,#ef4444);border-radius:8px;margin:0 auto;overflow:hidden;}
.bar-v .mk{position:absolute;left:-3px;right:-3px;height:4px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #000;}

/* dive hint */
#diveHint{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.78);color:#fff;padding:16px 26px;border-radius:14px;font-weight:800;letter-spacing:2px;text-align:center;z-index:10;pointer-events:none;border:1px solid rgba(255,200,80,0.4);}
#diveHint .ht{font-size:18px;}
#diveTimer{font-size:13px;color:#facc15;margin-top:4px;letter-spacing:1px;font-family:'Courier New',monospace;}

/* kick flash */
.kick-flash{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:56px;font-weight:900;letter-spacing:3px;pointer-events:none;z-index:20;animation:kf 1.3s ease-out forwards;text-shadow:0 4px 24px rgba(0,0,0,0.6),0 0 20px rgba(0,0,0,0.5);}
@keyframes kf{0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}60%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(.95);}}

/* result */
.res-ov{position:absolute;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;z-index:60;}
.res-card{background:#fff;color:#0a1424;border-radius:18px;padding:30px 36px;text-align:center;min-width:320px;box-shadow:0 30px 60px rgba(0,0,0,0.5);}
.res-card h2{margin:0 0 6px;font-size:32px;}
.res-card .delta{font-size:18px;margin:8px 0 18px;}
.res-card button{padding:10px 20px;border-radius:10px;border:none;background:#0a1424;color:#fff;cursor:pointer;font-weight:700;font-size:14px;}

/* leaderboard */
.lb{position:absolute;top:16px;right:16px;background:rgba(0,0,0,0.85);color:#fff;border-radius:14px;padding:14px 18px;min-width:280px;max-height:70vh;overflow:auto;z-index:65;backdrop-filter:blur(6px);animation:slin 280ms ease-out;border:1px solid rgba(255,200,80,0.3);}
@keyframes slin{from{transform:translateX(110%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.lb h3{margin:0 0 8px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#facc15;}
.lb table{width:100%;border-collapse:collapse;font-size:13px;}
.lb th,.lb td{padding:4px 6px;text-align:left;}
.lb th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.45);border-bottom:1px solid rgba(255,255,255,0.18);}
.lb td.n{text-align:right;font-variant-numeric:tabular-nums;}
.lb tr.me td{color:#facc15;font-weight:700;}
.lb .lbf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.lb .lbf button{background:#facc15;color:#0a1424;border:none;padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer;}
.lb .src{font-size:10px;color:rgba(255,255,255,0.4);}

/* setup */
.setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1a3a1a,#061206);z-index:50;padding:16px;overflow-y:auto;}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(12px);border-radius:18px;padding:32px 36px;width:100%;max-width:420px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.card h1{margin:0 0 6px;font-size:27px;}
.card .sub{color:rgba(255,255,255,0.55);font-size:13px;margin-bottom:22px;}
.card label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.55);margin-bottom:5px;}
.card input,.card select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.3);color:#fff;font-size:15px;margin-bottom:16px;outline:none;}
.card input:focus,.card select:focus{border-color:#facc15;}
.row{display:flex;gap:12px;}.row>*{flex:1;}
.diffs{display:flex;gap:8px;margin-bottom:22px;}
.diffs button{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);background:rgba(0,0,0,0.2);color:#fff;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:1px;transition:all 120ms;}
.diffs button.on{background:#facc15;color:#0a1424;border-color:#facc15;}
.go{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#4ade80,#16a34a);color:#fff;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 16px rgba(34,197,94,0.35);}
.go:hover{transform:translateY(-1px);}
.hidden{display:none!important;}

/* ── MOBILE ── */
@media (max-width:640px){
  .scoreboard{top:8px;gap:10px;padding:7px 14px;border-radius:8px;}
  .scoreboard::before,.scoreboard::after{display:none;}
  .tm{font-size:11px;letter-spacing:1px;gap:6px;}
  .tm .flag{font-size:15px;}
  .tm .tname{max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;}
  .dot{width:10px;height:10px;border-width:1px;}
  .dots{gap:3px;}
  .vs{font-size:12px;letter-spacing:2px;}
  #banner{top:54px;font-size:10px;padding:5px 14px;letter-spacing:1.5px;}
  #powerWrap{bottom:12px;padding:8px 14px;}
  .bar-v{width:18px;height:64px;}
  #powerWrap .lbl{font-size:10px;margin-bottom:4px;}
  #diveHint{padding:12px 18px;}
  #diveHint .ht{font-size:14px;letter-spacing:1.5px;}
  #diveTimer{font-size:12px;}
  .kick-flash{font-size:38px;letter-spacing:2px;}
  .res-card{min-width:0;width:100%;max-width:320px;padding:24px 24px;margin:0 16px;}
  .res-card h2{font-size:26px;}
  .res-card .delta{font-size:16px;}
  .lb{top:auto;bottom:0;left:0;right:0;border-radius:14px 14px 0 0;min-width:0;max-height:65vh;padding:12px 14px;animation:none;}
  .lb table{font-size:12px;}
  .card{padding:22px 22px;border-radius:14px;}
  .card h1{font-size:22px;}
  .card .sub{font-size:12px;margin-bottom:16px;}
  .card input,.card select{padding:9px 11px;font-size:16px;margin-bottom:12px;}
  .diffs button{padding:9px 4px;font-size:11px;letter-spacing:0.5px;}
  .go{padding:13px;font-size:15px;}
}
@media (max-height:520px) and (orientation:landscape){
  .scoreboard{top:6px;padding:5px 12px;}
  #banner{top:42px;}
  #powerWrap{bottom:8px;padding:6px 12px;}
  .bar-v{height:54px;}
  .card{padding:18px 22px;}
  .card h1{font-size:20px;margin-bottom:2px;}
  .card .sub{margin-bottom:12px;}
  .card input,.card select{margin-bottom:10px;padding:8px 10px;}
  .diffs{margin-bottom:12px;}
}

/* aim crosshair pulse */
#crosshair{pointer-events:none;}
#crosshair .ring{animation:chpulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes chpulse{0%,100%{opacity:0.9;transform:scale(1);}50%{opacity:0.55;transform:scale(1.18);}}

/* stats row on setup card */
.stats{display:flex;flex-wrap:wrap;gap:6px 12px;margin:-8px 0 18px;font-size:12px;color:rgba(255,255,255,0.6);}
.stats:empty{display:none;}
.stats span{font-variant-numeric:tabular-nums;}

/* share button on result card */
.res-card .btns{display:flex;gap:8px;justify-content:center;margin-top:4px;}
.res-card .btns button{padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px;}
.res-card .share{background:#16a34a;color:#fff;}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  body.shake #stage{animation:none;}
  .kick-flash{animation:none;opacity:1;}
  .lb{animation:none;}
  #keeper{transition:none;}
  #crosshair .ring{animation:none;}
  .go:hover{transform:none;}
}
</style>
</head>
<body>
<div id="app">
<div id="stage">

<!-- ═══════ SINGLE SCENE SVG ═══════ -->
<svg id="scene" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- gradients -->
  <linearGradient id="skyG" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#0a1a3a"/>
    <stop offset="1" stop-color="#1e3a5a"/>
  </linearGradient>
  <linearGradient id="grassG" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#1f6d1f"/>
    <stop offset="1" stop-color="#0d3d0d"/>
  </linearGradient>
  <linearGradient id="postLR" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#d8d8d8"/>
    <stop offset="0.3" stop-color="#ffffff"/>
    <stop offset="0.5" stop-color="#fafafa"/>
    <stop offset="1" stop-color="#b8b8b8"/>
  </linearGradient>
  <linearGradient id="postTB" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.5" stop-color="#f5f5f5"/>
    <stop offset="1" stop-color="#bbbbbb"/>
  </linearGradient>
  <radialGradient id="ballG" cx="35%" cy="30%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#c8c8c8"/>
  </radialGradient>
  <radialGradient id="floodG" cx="50%" cy="50%">
    <stop offset="0" stop-color="#fffde0" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#fffde0" stop-opacity="0"/>
  </radialGradient>

  <!-- net patterns -->
  <pattern id="netBack" x="0" y="0" width="11" height="11" patternUnits="userSpaceOnUse">
    <path d="M0,0 L11,11 M11,0 L0,11" stroke="rgba(255,255,255,0.65)" stroke-width="0.7" fill="none"/>
  </pattern>
  <pattern id="netSide" x="0" y="0" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="skewY(15)">
    <path d="M0,0 L11,11 M11,0 L0,11" stroke="rgba(255,255,255,0.32)" stroke-width="0.65" fill="none"/>
  </pattern>
  <pattern id="netTop" x="0" y="0" width="11" height="11" patternUnits="userSpaceOnUse">
    <path d="M0,0 L11,11 M11,0 L0,11" stroke="rgba(255,255,255,0.28)" stroke-width="0.65" fill="none"/>
  </pattern>

  <!-- pitch grass stripes -->
  <pattern id="grassSt" x="0" y="0" width="60" height="1" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="30" height="1" fill="rgba(255,255,255,0.045)"/>
  </pattern>

  <!-- ─── CROWD PATTERNS — mini heads ─── -->
  <pattern id="crowdR" patternUnits="userSpaceOnUse" width="14" height="17">
    <circle cx="7" cy="4.5" r="2.8" fill="#d4a574"/>
    <ellipse cx="7" cy="3.5" rx="2.8" ry="1.3" fill="#2a1a0a"/>
    <path d="M3,9 Q7,7.5 11,9 L11,17 L3,17 Z" fill="#c8102e"/>
  </pattern>
  <pattern id="crowdB" patternUnits="userSpaceOnUse" width="14" height="17">
    <circle cx="7" cy="4.5" r="2.8" fill="#e0b89a"/>
    <ellipse cx="7" cy="3.5" rx="2.8" ry="1.3" fill="#3a2515"/>
    <path d="M3,9 Q7,7.5 11,9 L11,17 L3,17 Z" fill="#003478"/>
  </pattern>
  <pattern id="crowdY" patternUnits="userSpaceOnUse" width="14" height="17">
    <circle cx="7" cy="4.5" r="2.8" fill="#c89060"/>
    <ellipse cx="7" cy="3.5" rx="2.8" ry="1.3" fill="#1a0e04"/>
    <path d="M3,9 Q7,7.5 11,9 L11,17 L3,17 Z" fill="#FFD700"/>
  </pattern>
  <pattern id="crowdW" patternUnits="userSpaceOnUse" width="14" height="17">
    <circle cx="7" cy="4.5" r="2.8" fill="#d8b294"/>
    <ellipse cx="7" cy="3.5" rx="2.8" ry="1.3" fill="#5a3a20"/>
    <path d="M3,9 Q7,7.5 11,9 L11,17 L3,17 Z" fill="#f0f0f0"/>
  </pattern>
  <pattern id="crowdG" patternUnits="userSpaceOnUse" width="14" height="17">
    <circle cx="7" cy="4.5" r="2.8" fill="#c89976"/>
    <ellipse cx="7" cy="3.5" rx="2.8" ry="1.3" fill="#2a1810"/>
    <path d="M3,9 Q7,7.5 11,9 L11,17 L3,17 Z" fill="#009b3a"/>
  </pattern>

  <filter id="postShadow" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow dx="2" dy="2" stdDeviation="1.8" flood-opacity="0.4"/>
  </filter>
</defs>

<!-- ── SKY ── -->
<rect x="-100" y="-50" width="1000" height="270" fill="url(#skyG)"/>

<!-- ── STARS ── -->
<circle cx="80" cy="20" r="0.8" fill="white" opacity="0.6"/>
<circle cx="220" cy="15" r="1" fill="white" opacity="0.7"/>
<circle cx="360" cy="28" r="0.7" fill="white" opacity="0.5"/>
<circle cx="510" cy="12" r="1.1" fill="white" opacity="0.7"/>
<circle cx="640" cy="22" r="0.8" fill="white" opacity="0.6"/>
<circle cx="730" cy="30" r="0.9" fill="white" opacity="0.5"/>

<!-- ── FLOODLIGHTS ── -->
<rect x="-2" y="60" width="3" height="135" fill="#aaa"/>
<rect x="-12" y="58" width="22" height="6" fill="#ccc" rx="1"/>
<ellipse cx="-1" cy="61" rx="14" ry="4" fill="url(#floodG)"/>
<rect x="797" y="60" width="3" height="135" fill="#aaa"/>
<rect x="790" y="58" width="22" height="6" fill="#ccc" rx="1"/>
<ellipse cx="801" cy="61" rx="14" ry="4" fill="url(#floodG)"/>

<!-- ── STADIUM ROOF / OVERHANG ── -->
<polygon points="-100,40 -100,75 900,75 900,40" fill="#2a3340"/>
<rect x="-100" y="72" width="1000" height="3" fill="#1a2128"/>

<!-- ── UPPER STANDS — sectioned, with mini-head crowd ── -->
<!-- Section A (left) -->
<rect x="-100" y="75" width="280" height="170" fill="#1c252e"/>
<rect x="-100" y="75" width="280" height="170" fill="url(#crowdR)" opacity="0.85"/>
<!-- Section B (centre-left) -->
<rect x="180" y="75" width="220" height="170" fill="#1e2832"/>
<rect x="180" y="75" width="220" height="170" fill="url(#crowdY)" opacity="0.85"/>
<!-- Section C (centre-right) -->
<rect x="400" y="75" width="220" height="170" fill="#1e2832"/>
<rect x="400" y="75" width="220" height="170" fill="url(#crowdW)" opacity="0.85"/>
<!-- Section D (right) -->
<rect x="620" y="75" width="280" height="170" fill="#1c252e"/>
<rect x="620" y="75" width="280" height="170" fill="url(#crowdB)" opacity="0.85"/>

<!-- Mid-section breaks (concrete dividers between stand blocks) -->
<rect x="178" y="75" width="4" height="170" fill="#0a0e14"/>
<rect x="398" y="75" width="4" height="170" fill="#0a0e14"/>
<rect x="618" y="75" width="4" height="170" fill="#0a0e14"/>

<!-- Horizontal divider lines for stand tiers -->
<line x1="-100" y1="135" x2="900" y2="135" stroke="rgba(0,0,0,0.45)" stroke-width="1.2"/>
<line x1="-100" y1="190" x2="900" y2="190" stroke="rgba(0,0,0,0.45)" stroke-width="1.2"/>

<!-- Stadium dimming overlay so foreground pops -->
<rect x="-100" y="75" width="1000" height="170" fill="rgba(0,0,0,0.18)"/>

<!-- ── STADIUM SCOREBOARD (jumbotron, high in stands) ── -->
<g>
  <rect x="320" y="92" width="160" height="38" fill="#0a0a0a" stroke="#444" stroke-width="2" rx="3"/>
  <rect x="324" y="96" width="152" height="30" fill="#1a1a1a" rx="2"/>
  <!-- LED dots flicker -->
  <text x="400" y="114" text-anchor="middle" font-family="Courier New,monospace" font-size="10" font-weight="bold" fill="#ffc857" letter-spacing="1.5">QATAR STADIUM</text>
  <text x="400" y="124" text-anchor="middle" font-family="Courier New,monospace" font-size="7" fill="#22c55e">▪ LIVE ▪ FINAL ▪</text>
  <!-- mounting brackets -->
  <line x1="335" y1="75" x2="345" y2="92" stroke="#444" stroke-width="1.5"/>
  <line x1="455" y1="75" x2="465" y2="92" stroke="#444" stroke-width="1.5"/>
</g>

<!-- ── ADVERTISING BOARDS — WORLD CUP THEMED ── -->
<g>
  <!-- Boards span full width, behind goal -->
  <rect x="-100" y="244" width="1000" height="24" fill="#0a0a0a"/>
  <!-- Board segments -->
  <rect x="-100" y="246" width="160" height="20" fill="#009b3a"/>
  <text x="-20" y="261" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFD700" font-family="Arial Black,sans-serif">BRASIL</text>

  <rect x="62" y="246" width="180" height="20" fill="#75aadb"/>
  <text x="152" y="261" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" font-family="Arial Black,sans-serif">ARGENTINA</text>

  <rect x="244" y="246" width="170" height="20" fill="#5a1538"/>
  <text x="329" y="261" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFD700" font-family="Arial Black,sans-serif">FIFA WORLD CUP</text>

  <rect x="416" y="246" width="120" height="20" fill="#002395"/>

<script>
// ─── DATA ───────────────────────────────────────────────────────
const COUNTRIES=[
  ["Brazil","🇧🇷"],["Uruguay","🇺🇾"],["Argentina","🇦🇷"],["England","🏴󠁧󠁢󠁥󠁮󠁧󠁿"],
  ["France","🇫🇷"],["Germany","🇩🇪"],["Spain","🇪🇸"],["Portugal","🇵🇹"],
  ["Italy","🇮🇹"],["Netherlands","🇳🇱"],["Belgium","🇧🇪"],["Croatia","🇭🇷"],
  ["USA","🇺🇸"],["Mexico","🇲🇽"],["Canada","🇨🇦"],["Japan","🇯🇵"],
  ["South Korea","🇰🇷"],["Australia","🇦🇺"],["Senegal","🇸🇳"],["Morocco","🇲🇦"],
  ["Nigeria","🇳🇬"],["Ghana","🇬🇭"],["Switzerland","🇨🇭"],["Denmark","🇩🇰"],
  ["Sweden","🇸🇪"],["Poland","🇵🇱"],["Colombia","🇨🇴"],["Ireland","🇮🇪"],
];

const DCFG={
  easy:  {powSpeed:0.9,  keeperSkill:0.30, cpuErr:0.45, diveMs:1900,  winPts:1,  lossPts:-3, cpuAim:0.15, cpuPow:0.35},
  medium:{powSpeed:1.55, keeperSkill:0.55, cpuErr:0.24, diveMs:1600,  winPts:2,  lossPts:-2, cpuAim:0.45, cpuPow:0.50},
  hard:  {powSpeed:2.2,  keeperSkill:0.78, cpuErr:0.12, diveMs:1380,  winPts:3,  lossPts:-1, cpuAim:0.80, cpuPow:0.65},
};

// SVG coords (viewBox 800x450)
const GF={x:179,y:124,w:442,h:224}; // goal front rect
const BALL_R=17;
const SPOT={x:400,y:412};
const KBASE={x:400,y:252};

// ─── STATE ──────────────────────────────────────────────────────
let S;
let powAnim=null;
let diveCountdown=null;

function mkState(){
  return{
    name:'',flag:'🇧🇷',country:'Brazil',
    oppFlag:'🇺🇾',oppCountry:'Uruguay',
    diff:'medium',dc:DCFG.medium,
    kicks:[],idx:0,scoreA:0,scoreB:0,
    phase:'setup',
    target:null, pow:null,
    cpuPlan:null, keeperPos:{x:KBASE.x,y:KBASE.y},
    golden:false, _goldenShown:false,
    aim:{x:GF.x+GF.w/2,y:GF.y+GF.h*0.5},
  };
}

// ─── KEEPER POSITIONING ─────────────────────────────────────────
function setKeeperDelta(kx,ky,instant){
  const k=document.getElementById('keeper');
  if(instant){
    k.style.transition='none';
    // force reflow so transition:none is applied before next transform
    void k.getBoundingClientRect();
  } else {
    k.style.transition='';
  }
  const dx=kx-KBASE.x;
  const dy=Math.min(KBASE.y+25,ky)-KBASE.y;
  const rot=Math.max(-55,Math.min(55,dx/4.2));
  k.style.transform=`translate(${dx}px,${dy}px) rotate(${rot}deg)`;
}

function resetKeeper(){
  const k=document.getElementById('keeper');
  k.style.transition='';
  k.style.transform='';
}

// ─── SETUP ──────────────────────────────────────────────────────
function fillSelects(){
  const a=document.getElementById('iCountry');
  const b=document.getElementById('iOpp');
  COUNTRIES.forEach(([n,f],i)=>{
    a.insertAdjacentHTML('beforeend',`<option value="${i}" ${n==='Brazil'?'selected':''}>${f} ${n}</option>`);
    b.insertAdjacentHTML('beforeend',`<option value="${i}" ${n==='Uruguay'?'selected':''}>${f} ${n}</option>`);
  });
  const sv=JSON.parse(localStorage.getItem('ps_profile')||'{}');
  if(sv.name) document.getElementById('iName').value=sv.name;
  if(sv.ci!=null) a.value=sv.ci;
  if(sv.d) document.querySelectorAll('.diffs button').forEach(b=>b.classList.toggle('on',b.dataset.d===sv.d));
}

document.querySelectorAll('.diffs button').forEach(b=>{
  b.addEventListener('click',()=>{document.querySelectorAll('.diffs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
});

document.getElementById('goBtn').addEventListener('click',()=>{
  S=mkState();
  const raw=document.getElementById('iName').value.trim()||'Player 1';
  S.name=raw.replace(/[\x00-\x1f]/g,'').slice(0,24);
  const ci=+document.getElementById('iCountry').value;
  const bi=+document.getElementById('iOpp').value;
  [S.country,S.flag]=COUNTRIES[ci];
  [S.oppCountry,S.oppFlag]=COUNTRIES[bi];
  const d=document.querySelector('.diffs button.on').dataset.d;
  S.diff=d; S.dc=DCFG[d];
  localStorage.setItem('ps_profile',JSON.stringify({name:S.name,ci,d}));

  document.querySelector('#tA .flag').textContent=S.flag;
  document.querySelector('#tA .tname').textContent=S.name.toUpperCase();
  document.querySelector('#tB .flag').textContent=S.oppFlag;
  document.querySelector('#tB .tname').textContent=S.oppCountry.toUpperCase();

  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('banner').classList.remove('hidden');
  resetKeeper();
  renderDots();
  nextTurn();
});

// ─── TURN FLOW ──────────────────────────────────────────────────
function nextTurn(){
  if(matchOver()) return endMatch();
  renderDots();
  if(S.golden&&!S._goldenShown){S._goldenShown=true;showFlash('⚡ SUDDEN DEATH',null);}
  if(S.idx%2===0){
    setBanner(S.golden?'SUDDEN DEATH — aim & shoot':'YOUR SHOT — aim & click (or arrows + space)');
    S.phase='shoot_aim';
    enableAim();
  } else {
    setBanner('CPU SHOOTING...');
    S.phase='keep_wait';
    setTimeout(startKeeperRound,900);
  }
}

function setBanner(t){document.getElementById('banner').textContent=t;}

function renderDots(){
  ['A','B'].forEach(t=>{
    const el=document.getElementById('dots'+t);
    el.innerHTML='';
    const ks=S.kicks.filter(k=>k.t===t);
    for(let i=0;i<Math.max(5,ks.length);i++){
      const k=ks[i];
      el.insertAdjacentHTML('beforeend',`<div class="dot${k?(k.g?' g':' m'):''}"></div>`);
    }
  });
}

function matchOver(){
  const kA=S.kicks.filter(k=>k.t==='A').length;
  const kB=S.kicks.filter(k=>k.t==='B').length;
  // In golden goal, only decide once both have shot in the round (kA===kB)
  if(S.golden){
    return kA===kB&&S.scoreA!==S.scoreB;
  }
  const remA=Math.max(0,5-kA), remB=Math.max(0,5-kB);
  if(Math.abs(S.scoreA-S.scoreB)>Math.max(remA,remB)) return true;
  if(kA>=5&&kB>=5){
    if(S.scoreA===S.scoreB){S.golden=true;return false;}
    return true;
  }
  return false;
}

// ─── PLAYER SHOOT ───────────────────────────────────────────────
function clampAim(x,y){
  return{
    x:Math.max(GF.x+BALL_R+2,Math.min(GF.x+GF.w-BALL_R-2,x)),
    y:Math.max(GF.y+BALL_R+2,Math.min(GF.y+GF.h-BALL_R-2,y)),
  };
}
function showCrosshair(x,y){
  const c=document.getElementById('crosshair');
  c.classList.remove('hidden');
  c.setAttribute('transform',`translate(${x} ${y})`);
}
function hideCrosshair(){document.getElementById('crosshair').classList.add('hidden');}

function enableAim(){
  const svg=document.getElementById('scene');
  // start crosshair at last/centre aim point
  S.aim=clampAim(S.aim.x,S.aim.y);
  showCrosshair(S.aim.x,S.aim.y);

  const toSvg=src=>{
    const r=svg.getBoundingClientRect();
    return clampAim(((src.clientX-r.left)/r.width)*800,((src.clientY-r.top)/r.height)*450);
  };
  const preview=p=>{S.aim=p;showCrosshair(p.x,p.y);};
  const lock=()=>{
    if(S.phase!=='shoot_aim')return;
    S.target={x:S.aim.x,y:S.aim.y};
    teardown();
    startPowerMeter();
  };
  const onMove=e=>{if(S.phase==='shoot_aim')preview(toSvg(e));};
  const onClick=e=>{if(S.phase!=='shoot_aim')return;preview(toSvg(e));e.stopPropagation();lock();};
  const onTouch=e=>{if(S.phase==='shoot_aim'&&e.touches[0]){e.preventDefault();preview(toSvg(e.touches[0]));}};
  const onTouchEnd=e=>{if(S.phase!=='shoot_aim')return;e.preventDefault();lock();};
  const onKey=e=>{
    if(S.phase!=='shoot_aim')return;
    const step=e.shiftKey?6:16;
    let a={x:S.aim.x,y:S.aim.y};
    if(e.key==='ArrowLeft')a.x-=step;
    else if(e.key==='ArrowRight')a.x+=step;
    else if(e.key==='ArrowUp')a.y-=step;
    else if(e.key==='ArrowDown')a.y+=step;
    else if(e.key===' '||e.key==='Enter'){e.preventDefault();lock();return;}
    else return;
    e.preventDefault();
    preview(clampAim(a.x,a.y));
  };
  function teardown(){
    svg.removeEventListener('mousemove',onMove);
    svg.removeEventListener('click',onClick);
    svg.removeEventListener('touchstart',onTouch);
    svg.removeEventListener('touchmove',onTouch);
    svg.removeEventListener('touchend',onTouchEnd);
    window.removeEventListener('keydown',onKey);
    hideCrosshair();
    S._aimTeardown=null;
  }
  svg.addEventListener('mousemove',onMove);
  svg.addEventListener('click',onClick);
  svg.addEventListener('touchstart',onTouch,{passive:false});
  svg.addEventListener('touchmove',onTouch,{passive:false});
  svg.addEventListener('touchend',onTouchEnd,{passive:false});
  window.addEventListener('keydown',onKey);
  S._aimTeardown=teardown;
}

function startPowerMeter(){
  S.phase='shoot_pow';
  S.pow=null;
  // Guard: ignore any click synthesized from the aim tap/gesture that just locked.
  S._powArmed=false;
  setTimeout(()=>{if(S)S._powArmed=true;},180);
  setBanner('Lock POWER (click / space)');
  document.getElementById('powerWrap').classList.remove('hidden');
  document.getElementById('powMk').style.bottom='0px';
  const start=performance.now();
  const spd=S.dc.powSpeed;
  if(powAnim) cancelAnimationFrame(powAnim);
  function tick(now){
    if(S.phase!=='shoot_pow') return;
    const v=(Math.sin((now-start)/1000*2.3*spd)+1)/2;
    document.getElementById('powMk').style.bottom=(v*76)+'px';
    powAnim=requestAnimationFrame(tick);
  }
  powAnim=requestAnimationFrame(tick);
}

document.getElementById('app').addEventListener('click',e=>{
  if(!S) return;
  if(e.target.closest('#setupScreen')||e.target.closest('.res-ov')||e.target.closest('.lb')) return;
  if(S.phase==='shoot_pow'&&S._powArmed){
    const v=parseFloat(document.getElementById('powMk').style.bottom)||0;
    S.pow=v/76;
    cancelAnimationFrame(powAnim); powAnim=null;
    document.getElementById('powerWrap').classList.add('hidden');
    S.phase='animating';
    setBanner('');
    doPlayerShot();
  }
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&S&&S.phase==='shoot_pow'){e.preventDefault();document.getElementById('app').click();}
});

function doPlayerShot(){
  const fx=S.target.x, fy=S.target.y;
  const ctrl={x:fx,y:(SPOT.y+fy)/2-25};
  const dur=1600-S.pow*750;

  // AI keeper dive — choose target then dive
  let kx,ky,reach;
  if(S.diff==='easy'){
    const cs=[{x:GF.x+55,y:GF.y+80},{x:GF.x+GF.w-55,y:GF.y+80},{x:GF.x+60,y:GF.y+GF.h-60},{x:GF.x+GF.w-60,y:GF.y+GF.h-60}];
    const c=cs[Math.floor(Math.random()*4)]; kx=c.x; ky=c.y; reach=58;
  } else if(S.diff==='medium'){
    kx=fx+(Math.random()-.5)*150; ky=fy+(Math.random()-.5)*90; reach=68;
  } else {
    kx=fx+(Math.random()-.5)*55; ky=fy+(Math.random()-.5)*40; reach=80;
  }
  // clamp keeper reach inside goal area so they don't leap out
  kx=Math.max(GF.x+25,Math.min(GF.x+GF.w-25,kx));
  ky=Math.max(GF.y+30,Math.min(GF.y+GF.h-20,ky));
  S._kr={x:kx,y:ky,r:reach};

  setTimeout(()=>setKeeperDelta(kx,ky,false),dur*0.28);

  animBall(SPOT,ctrl,{x:fx,y:fy},dur,()=>{
    const post=checkPost(fx,fy);
    if(post!==null){
      showFlash('🥅 POST!',null);
      setTimeout(()=>{
        const goal=post&&fy>GF.y+BALL_R&&fy<GF.y+GF.h-BALL_R;
        if(goal&&S.pow>0.78) trigShake();
        showFlash(goal?'⚽ GOAL!':'OFF THE POST!',goal);
        recordKick('A',goal);
        setTimeout(resetRound,900);
      },650);
      return;
    }
    const inGoal=fx>GF.x+BALL_R&&fx<GF.x+GF.w-BALL_R&&fy>GF.y+BALL_R&&fy<GF.y+GF.h-BALL_R;
    let saved=false;
    if(inGoal&&S._kr) saved=Math.hypot(S._kr.x-fx,S._kr.y-fy)<S._kr.r;
    const goal=inGoal&&!saved;
    if(goal&&S.pow>0.78) trigShake();
    showFlash(goal?'⚽ GOAL!':(inGoal?'SAVED! 🧤':'MISS! 😬'),goal);
    recordKick('A',goal);
    if(!goal&&inGoal){animBallReturn({x:fx,y:fy},()=>setTimeout(resetRound,300));}
    else{setTimeout(resetRound,1300);}
  });
}

// ─── PLAYER KEEPS — drag keeper to save ─────────────────────────
function startKeeperRound(){
  setBanner(S.golden?'SUDDEN DEATH — DEFEND!':'DEFEND — DRAG THE KEEPER!');
  // Harder difficulty picks goal corners (harder to reach); easier sprays at random.
  let tx,ty;
  if(Math.random()<S.dc.cpuAim){
    const cx=Math.random()<0.5?GF.x+BALL_R+14:GF.x+GF.w-BALL_R-14;
    const cy=Math.random()<0.65?GF.y+BALL_R+12:GF.y+GF.h-BALL_R-14; // favour top corners
    tx=cx+(Math.random()-.5)*30;
    ty=cy+(Math.random()-.5)*24;
  } else {
    tx=GF.x+BALL_R+10+Math.random()*(GF.w-BALL_R*2-20);
    ty=GF.y+BALL_R+10+Math.random()*(GF.h-BALL_R*2-20);
  }
  tx=Math.max(GF.x+BALL_R+2,Math.min(GF.x+GF.w-BALL_R-2,tx));
  ty=Math.max(GF.y+BALL_R+2,Math.min(GF.y+GF.h-BALL_R-2,ty));
  const pow=S.dc.cpuPow+Math.random()*(1-S.dc.cpuPow)*0.7;
  const dur=1600-pow*750;
  S.cpuPlan={target:{x:tx,y:ty},ctrl:{x:tx,y:(SPOT.y+ty)/2-25},dur,pow};

  resetKeeper();
  S.keeperPos={x:KBASE.x,y:KBASE.y};
  S._kr=null;
  S.phase='keep_dive';

  document.getElementById('diveHint').classList.remove('hidden');
  document.getElementById('scene').classList.add('dragmode');

  const totalMs=S.dc.diveMs;
  const start=performance.now();
  diveCountdown=setInterval(()=>{
    const rem=Math.max(0,(totalMs-(performance.now()-start))/1000);
    document.getElementById('diveTimer').textContent=rem>0?rem.toFixed(1)+'s':'KICK!';
    if(rem<=0){
      clearInterval(diveCountdown); diveCountdown=null;
      fireCpuShot();
    }
  },50);

  // Drag handlers
  const svg=document.getElementById('scene');
  let dragging=false;
  function onDown(e){
    if(S.phase!=='keep_dive') return;
    dragging=true;
    moveKeeperFromEvent(e);
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging||S.phase!=='keep_dive') return;
    moveKeeperFromEvent(e);
  }
  function onUp(){dragging=false;}
  function moveKeeperFromEvent(e){
    const r=svg.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width)*800;
    const y=((e.clientY-r.top)/r.height)*450;
    const kx=Math.max(GF.x+25,Math.min(GF.x+GF.w-25,x));
    const ky=Math.max(GF.y+30,Math.min(GF.y+GF.h-20,y));
    S.keeperPos={x:kx,y:ky};
    setKeeperDelta(kx,ky,true); // instant follow
  }
  svg.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  // touch — passive:false so preventDefault stops the page from scrolling under the drag
  const onTouchStart=e=>{if(e.touches[0]){e.preventDefault();onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY,preventDefault:()=>{}});}};
  const onTouchMove=e=>{if(e.touches[0]){e.preventDefault();onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});}};
  svg.addEventListener('touchstart',onTouchStart,{passive:false});
  window.addEventListener('touchmove',onTouchMove,{passive:false});
  window.addEventListener('touchend',onUp);
  S._keeperCleanup=()=>{
    svg.removeEventListener('mousedown',onDown);
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('mouseup',onUp);
    svg.removeEventListener('touchstart',onTouchStart);
    window.removeEventListener('touchmove',onTouchMove);
    window.removeEventListener('touchend',onUp);
    document.getElementById('scene').classList.remove('dragmode');
  };
}

function fireCpuShot(){
  if(S._keeperCleanup){S._keeperCleanup();S._keeperCleanup=null;}
  document.getElementById('diveHint').classList.add('hidden');
  S.phase='animating_keep';
  const plan=S.cpuPlan;

  animBall(SPOT,plan.ctrl,plan.target,plan.dur,()=>{
    const {x:tx,y:ty}=plan.target;
    const post=checkPost(tx,ty);
    if(post!==null){
      showFlash('🥅 POST!',null);
      setTimeout(()=>{
        const goal=post&&ty>GF.y+BALL_R&&ty<GF.y+GF.h-BALL_R;
        showFlash(goal?'CPU SCORES!':'OFF THE POST!',!goal);
        recordKick('B',goal);
        setTimeout(resetRound,900);
      },650);
      return;
    }
    const inGoal=tx>GF.x+BALL_R&&tx<GF.x+GF.w-BALL_R&&ty>GF.y+BALL_R&&ty<GF.y+GF.h-BALL_R;
    const reach=S.diff==='hard'?64:(S.diff==='medium'?74:86);
    const d=Math.hypot(S.keeperPos.x-tx,S.keeperPos.y-ty);
    const saved=d<reach||!inGoal;
    const goal=!saved;
    if(goal&&plan.pow>0.78) trigShake();
    showFlash(goal?'CPU SCORES!':'YOU SAVED IT! 🧤',!goal);
    recordKick('B',goal);
    if(!goal&&inGoal){animBallReturn({x:tx,y:ty},()=>setTimeout(resetRound,300));}
    else{setTimeout(resetRound,1300);}
  });
}

// ─── POST DEFLECTION ────────────────────────────────────────────
function checkPost(x,y){
  const inH=y>GF.y+BALL_R&&y<GF.y+GF.h-BALL_R;
  const inW=x>GF.x+BALL_R&&x<GF.x+GF.w-BALL_R;
  if(inH&&Math.abs(x-GF.x)<14) return Math.random()<0.45;
  if(inH&&Math.abs(x-(GF.x+GF.w))<14) return Math.random()<0.45;
  if(inW&&Math.abs(y-GF.y)<14) return Math.random()<0.3;
  return null;
}

// ─── BALL ANIM ──────────────────────────────────────────────────
function bezier(p0,p1,p2,t){
  const u=1-t;
  return{x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x, y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y};
}

function animBall(p0,p1,p2,dur,done){
  const ball=document.getElementById('ball');
  const shadow=document.getElementById('ballShadow');
  const start=performance.now();
  function step(now){
    const t=Math.min(1,(now-start)/dur);
    const p=bezier(p0,p1,p2,t);
    const scale=1.25-t*0.65;
    ball.style.transform=`translate(${p.x-SPOT.x}px,${p.y-SPOT.y}px) scale(${scale})`;
    shadow.setAttribute('cy', 424+(p.y-SPOT.y));
    shadow.setAttribute('cx', 400+(p.x-SPOT.x));
    shadow.setAttribute('rx', 18*scale);
    shadow.setAttribute('ry', 5*scale);
    shadow.setAttribute('opacity', 0.4*(1-t*0.5));
    if(t<1) requestAnimationFrame(step);
    else done&&done();
  }
  requestAnimationFrame(step);
}

// ─── BALL RETURN ANIM ───────────────────────────────────────────
function animBallReturn(from,done){
  const ball=document.getElementById('ball');
  const shadow=document.getElementById('ballShadow');
  const start=performance.now();
  const dur=500;
  function step(now){
    const t=Math.min(1,(now-start)/dur);
    const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const p={x:from.x+(SPOT.x-from.x)*ease,y:from.y+(SPOT.y-from.y)*ease};
    const scale=0.55+ease*0.45;
    ball.style.transform=`translate(${p.x-SPOT.x}px,${p.y-SPOT.y}px) scale(${scale})`;
    shadow.setAttribute('cy',424+(p.y-SPOT.y));
    shadow.setAttribute('cx',400+(p.x-SPOT.x));
    shadow.setAttribute('rx',18*scale);
    shadow.setAttribute('ry',5*scale);
    shadow.setAttribute('opacity','0.4');
    if(t<1) requestAnimationFrame(step);
    else done&&done();
  }
  requestAnimationFrame(step);
}

// ─── HELPERS ────────────────────────────────────────────────────
function showFlash(txt,good){
  const el=document.createElement('div');
  el.className='kick-flash';
  el.style.color=good===null?'#facc15':(good?'#22c55e':'#ef4444');
  el.textContent=txt;
  document.getElementById('stage').appendChild(el);
  setTimeout(()=>el.remove(),1400);
}
function trigShake(){
  document.body.classList.add('shake');
  setTimeout(()=>document.body.classList.remove('shake'),240);
}
function recordKick(team,goal){
  S.kicks.push({t:team,g:goal});
  if(team==='A'&&goal) S.scoreA++;
  if(team==='B'&&goal) S.scoreB++;
  S.idx++;
  renderDots();
}
function resetRound(){
  cancelAnimationFrame(powAnim); powAnim=null;
  clearInterval(diveCountdown); diveCountdown=null;
  if(S._keeperCleanup){S._keeperCleanup();S._keeperCleanup=null;}
  if(S._aimTeardown){S._aimTeardown();}
  hideCrosshair();
  document.getElementById('powerWrap').classList.add('hidden');
  document.getElementById('diveHint').classList.add('hidden');
  document.getElementById('ball').style.transform='';
  resetKeeper();
  S._kr=null; S.target=null; S.pow=null;
  S.keeperPos={x:KBASE.x,y:KBASE.y};
  const sh=document.getElementById('ballShadow');
  sh.setAttribute('cx','400'); sh.setAttribute('cy','424');
  sh.setAttribute('rx','18'); sh.setAttribute('ry','5'); sh.setAttribute('opacity','0.4');
  nextTurn();
}

// ─── MATCH END ──────────────────────────────────────────────────
function endMatch(){
  S.phase='over';
  const won=S.scoreA>S.scoreB;
  const pts=won?S.dc.winPts:S.dc.lossPts;
  submitScore(pts,won);
  const st=updateStats(won);
  setTimeout(()=>showResult(won,pts,st),400);
}
function showResult(won,pts,st){
  const ov=document.createElement('div');
  ov.className='res-ov';
  const streakLine=won&&st.streak>1?`<div class="delta" style="color:#f97316">🔥 ${st.streak} win streak</div>`:'';
  ov.innerHTML=`<div class="res-card">
    <h2>${won?'YOU WIN! 🏆':'YOU LOSE 💔'}</h2>
    <div>Score: ${S.scoreA} – ${S.scoreB}</div>
    <div class="delta" style="color:${pts>=0?'#16a34a':'#dc2626'}">${pts>0?'+':''}${pts} pts</div>
    ${streakLine}
    <div class="btns">
      <button class="share" id="shareRes">Share</button>
      <button id="cRes">Leaderboard</button>
    </div>
  </div>`;
  document.getElementById('app').appendChild(ov);
  document.getElementById('cRes').addEventListener('click',()=>{ov.remove();showLB();});
  document.getElementById('shareRes').addEventListener('click',()=>shareResult(won,pts));
}

// ─── STATS (local) ──────────────────────────────────────────────
function loadStats(){try{return JSON.parse(localStorage.getItem('ps_stats')||'{}');}catch(_){return{};}}
function updateStats(won){
  const s=loadStats();
  s.gp=(s.gp||0)+1;
  s.goals=(s.goals||0)+S.scoreA;
  if(won){s.wins=(s.wins||0)+1;s.streak=(s.streak||0)+1;s.best=Math.max(s.best||0,s.streak);}
  else{s.streak=0;}
  localStorage.setItem('ps_stats',JSON.stringify(s));
  return s;
}
function renderStats(){
  const s=loadStats(),el=document.getElementById('statRow');
  if(!el)return;
  el.innerHTML=s.gp?`<span>🎮 ${s.gp} played</span><span>🏆 ${s.wins||0} won</span><span>🔥 ${s.streak||0} streak</span><span>⭐ best ${s.best||0}</span><span>⚽ ${s.goals||0} goals</span>`:'';
}

// ─── SHARE ──────────────────────────────────────────────────────
function shareResult(won,pts){
  const txt=`⚽ Penalty Shoot-out\n${S.flag} ${S.name} ${S.scoreA}–${S.scoreB} ${S.oppFlag} ${S.oppCountry}\n${won?'WIN 🏆':'LOSS 💔'} on ${S.diff} (${pts>0?'+':''}${pts} pts)\n${location.origin}${location.pathname}`;
  if(navigator.share){navigator.share({title:'Penalty Shoot-out',text:txt}).catch(()=>{});return;}
  const btn=document.getElementById('shareRes');
  const restore=()=>{if(btn)btn.textContent='Share';};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{if(btn){btn.textContent='Copied!';setTimeout(restore,1500);}}).catch(()=>{if(btn){btn.textContent='Copy failed';setTimeout(restore,1500);}});
  }else if(btn){btn.textContent='Copy failed';setTimeout(restore,1500);}
}

// ─── LEADERBOARD ────────────────────────────────────────────────
async function submitScore(pts,won){
  try{
    await fetch('/api/leaderboard',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({name:S.name,country:S.country,pointsDelta:pts,won,difficulty:S.diff}),
      signal:AbortSignal.timeout(4000)});
  }catch(_){}
  const key='ps_lb';
  const d=JSON.parse(localStorage.getItem(key)||'{}');
  const id=`${S.name}|${S.country}`;
  if(!d[id]) d[id]={name:S.name,country:S.country,pts:0,gp:0};
  d[id].pts+=pts; d[id].gp+=1;
  localStorage.setItem(key,JSON.stringify(d));
}
async function fetchLB(){
  try{
    const r=await fetch('/api/leaderboard',{signal:AbortSignal.timeout(4000)});
    if(r.ok){const d=await r.json();return{e:d.entries||[],src:'remote'};}
  }catch(_){}
  const d=JSON.parse(localStorage.getItem('ps_lb')||'{}');
  return{e:Object.values(d).sort((a,b)=>b.pts-a.pts).slice(0,10),src:'local'};
}
async function showLB(){
  const{e,src}=await fetchLB();
  const panel=document.createElement('div');
  panel.className='lb';
  const rows=e.length?e.map((r,i)=>{
    const me=r.name===S.name&&r.country===S.country;
    const fl=(COUNTRIES.find(c=>c[0]===(r.country||''))||['',''])[1];
    const pts=r.pts!=null?r.pts:r.points;
    const gp=r.gp!=null?r.gp:r.games;
    return`<tr class="${me?'me':''}"><td>${i+1}</td><td>${fl} ${esc(r.name)}</td><td class="n">${pts}</td><td class="n">${gp}</td></tr>`;
  }).join(''):`<tr><td colspan="4" style="opacity:.6;padding:8px 0">No entries yet!</td></tr>`;
  panel.innerHTML=`<h3>Leaderboard</h3>
    <table><thead><tr><th>#</th><th>Player</th><th>Pts</th><th>GP</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="lbf"><span class="src">${src}</span><button id="lbClose">Play again</button></div>`;
  document.getElementById('app').appendChild(panel);
  document.getElementById('lbClose').addEventListener('click',()=>{
    panel.remove();
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('banner').classList.add('hidden');
    document.getElementById('setupScreen').classList.remove('hidden');
    renderStats();
  });
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

fillSelects();
renderStats();
</script>
