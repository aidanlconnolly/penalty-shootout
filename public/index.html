<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Penalty Shoot-out</title>
<style>
  :root {
    --sky1:#7ec8ff;--sky2:#b8e2ff;--grass1:#2f8f3f;--grass2:#43b557;
    --pitch1:#c45c2a;--pitch2:#d97b48;--ink:#14202c;--paper:#fdfdfd;
    --accent:#f7c948;--danger:#e23b3b;--ok:#2ecc71;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);background:linear-gradient(#0a1622,#11253a);overflow:hidden;user-select:none;}
  #app{position:relative;width:100vw;height:100vh;overflow:hidden;}
  #stage{position:absolute;inset:0;}
  body.shake-mild #stage{animation:shake 220ms ease-out;}
  @keyframes shake{0%{transform:translate(0,0);}20%{transform:translate(-2px,1px);}
    40%{transform:translate(2px,-1px);}60%{transform:translate(-1px,2px);}
    80%{transform:translate(1px,-2px);}100%{transform:translate(0,0);}}

  /* setup */
  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at top,#1c3a5e,#0a1622);color:var(--paper);z-index:50;}
  .card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);border-radius:18px;padding:32px 36px;width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);}
  .card h1{margin:0 0 8px;font-size:28px;}
  .card .sub{color:rgba(255,255,255,0.6);font-size:13px;margin-bottom:22px;}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:rgba(255,255,255,0.6);margin-bottom:6px;}
  input[type=text],select{width:100%;padding:10px 12px;border-radius:10px;
    border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.25);
    color:var(--paper);font-size:15px;margin-bottom:16px;outline:none;}
  input[type=text]:focus,select:focus{border-color:var(--accent);}
  .row{display:flex;gap:12px;}.row>*{flex:1;}
  .difficulty{display:flex;gap:8px;margin-bottom:22px;}
  .difficulty button{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);
    background:rgba(0,0,0,0.2);color:var(--paper);cursor:pointer;font-size:13px;
    text-transform:uppercase;letter-spacing:1px;transition:all 120ms;}
  .difficulty button.active{background:var(--accent);color:var(--ink);border-color:var(--accent);}
  .start-btn{width:100%;padding:14px;border-radius:12px;border:none;
    background:linear-gradient(135deg,#4ade80,#22c55e);color:white;font-size:16px;
    font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;
    box-shadow:0 6px 16px rgba(34,197,94,0.35);}
  .start-btn:hover{transform:translateY(-1px);}

  /* scene */
  .scene{position:absolute;inset:0;background:linear-gradient(180deg,
    var(--sky1) 0%,var(--sky2) 40%,var(--grass2) 41%,var(--grass1) 60%,
    var(--pitch2) 61%,var(--pitch1) 100%);}
  .bunting{position:absolute;top:14px;left:0;right:0;height:30px;
    background-image:repeating-linear-gradient(45deg,#e23b3b 0 12px,#f7c948 12px 24px,
      #4ea3ff 24px 36px,#2ecc71 36px 48px);
    -webkit-mask-image:radial-gradient(circle 14px at 12px 0,black 13px,transparent 14px);
    -webkit-mask-repeat:repeat-x;mask-image:radial-gradient(circle 14px at 12px 0,black 13px,transparent 14px);
    mask-repeat:repeat-x;opacity:0.85;}

  /* HUD */
  .hud-top{position:absolute;top:18px;left:0;right:0;display:flex;
    justify-content:center;align-items:center;gap:24px;z-index:5;pointer-events:none;}
  .team{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.35);
    color:#fff;padding:8px 14px;border-radius:30px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;font-size:13px;}
  .team .flag{font-size:18px;}
  .score-bar{display:flex;gap:6px;}
  .dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.35);
    border:2px solid rgba(0,0,0,0.3);}
  .dot.goal{background:var(--ok);}
  .dot.miss{background:var(--danger);}
  .turn-banner{position:absolute;top:70px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,0.6);color:#fff;padding:6px 16px;border-radius:20px;
    font-size:13px;letter-spacing:1.5px;text-transform:uppercase;z-index:5;pointer-events:none;}

  /* pitch */
  .pitch-area{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:720px;max-width:90vw;aspect-ratio:16/9;}
  svg.pitch{width:100%;height:100%;display:block;overflow:visible;}
  .crosshair{position:absolute;width:48px;height:48px;border:2px solid rgba(255,255,255,0.85);
    border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:screen;}
  .crosshair::before,.crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.85);}
  .crosshair::before{left:50%;top:-8px;bottom:-8px;width:2px;transform:translateX(-50%);}
  .crosshair::after{top:50%;left:-8px;right:-8px;height:2px;transform:translateY(-50%);}

  /* meters — two oscillating bars */
  .meters{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:24px;align-items:flex-end;z-index:8;pointer-events:none;}
  .meter{background:rgba(0,0,0,0.55);padding:10px 12px;border-radius:12px;
    color:#fff;text-align:center;font-size:11px;letter-spacing:1px;text-transform:uppercase;min-width:160px;}
  .meter.locked{opacity:0.5;}
  .meter .label{margin-bottom:6px;color:rgba(255,255,255,0.7);}
  .bar-h{position:relative;width:140px;height:14px;
    background:linear-gradient(90deg,#e23b3b 0%,#e23b3b 20%,#2ecc71 40%,#2ecc71 60%,#e23b3b 80%,#e23b3b 100%);
    border-radius:7px;overflow:hidden;}
  .bar-h .marker{position:absolute;top:-3px;bottom:-3px;width:4px;background:#fff;
    border-radius:2px;box-shadow:0 0 0 1px #000;}
  .bar-v{position:relative;width:22px;height:80px;
    background:linear-gradient(0deg,#f7e08c 0%,#f7c948 30%,#f39c12 65%,#e23b3b 100%);
    border-radius:8px;margin:0 auto;overflow:hidden;}
  .bar-v .marker{position:absolute;left:-3px;right:-3px;height:4px;background:#fff;
    border-radius:2px;box-shadow:0 0 0 1px #000;}

  /* curve picker — static vertical panel, left side */
  .curve-panel{position:absolute;left:24px;top:50%;transform:translateY(-50%);
    background:rgba(0,0,0,0.55);border-radius:14px;padding:10px 8px;
    display:flex;flex-direction:column;gap:8px;z-index:9;pointer-events:all;}
  .curve-panel .cp-label{color:rgba(255,255,255,0.6);font-size:10px;letter-spacing:1px;
    text-transform:uppercase;text-align:center;margin-bottom:2px;}
  .curve-opt{width:60px;height:44px;border-radius:10px;border:2px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:all 120ms;}
  .curve-opt:hover{border-color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.1);}
  .curve-opt.selected{border-color:var(--accent);background:rgba(247,201,72,0.2);}
  .curve-opt svg{display:block;}

  /* goal/miss flash */
  .kick-flash{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
    font-size:52px;font-weight:900;letter-spacing:4px;pointer-events:none;z-index:20;
    animation:flashpop 1.1s ease-out forwards;}
  @keyframes flashpop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
    60%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(0.95);}}

  /* dive */
  .dive-prompt{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.7);color:#fff;padding:18px 30px;border-radius:14px;
    font-size:28px;font-weight:800;letter-spacing:3px;z-index:7;pointer-events:none;
    animation:pulse 600ms infinite alternate;}
  @keyframes pulse{from{transform:translate(-50%,-50%) scale(1);}to{transform:translate(-50%,-50%) scale(1.06);}}

  /* result */
  .result-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;z-index:60;}
  .result-card{background:var(--paper);color:var(--ink);border-radius:18px;
    padding:30px 36px;text-align:center;min-width:320px;box-shadow:0 30px 60px rgba(0,0,0,0.5);}
  .result-card h2{margin:0 0 6px;font-size:32px;}
  .result-card .delta{font-size:18px;margin:8px 0 16px;}
  .result-card button{padding:10px 18px;border-radius:10px;border:none;background:var(--ink);
    color:#fff;cursor:pointer;font-weight:600;}

  /* leaderboard */
  .leaderboard{position:absolute;top:16px;right:16px;background:rgba(0,0,0,0.78);
    color:#fff;border-radius:14px;padding:14px 16px;min-width:280px;max-height:70vh;
    overflow:auto;z-index:65;backdrop-filter:blur(6px);
    box-shadow:0 18px 40px rgba(0,0,0,0.4);animation:slidein 280ms ease-out;}
  @keyframes slidein{from{transform:translateX(110%);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .leaderboard h3{margin:0 0 8px;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
  .leaderboard table{width:100%;border-collapse:collapse;font-size:13px;}
  .leaderboard th,.leaderboard td{padding:4px 6px;text-align:left;}
  .leaderboard th{font-size:10px;text-transform:uppercase;letter-spacing:1px;
    color:rgba(255,255,255,0.5);border-bottom:1px solid rgba(255,255,255,0.2);}
  .leaderboard td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .leaderboard tr.me td{color:var(--accent);font-weight:700;}
  .leaderboard .footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .leaderboard .footer button{background:var(--accent);color:var(--ink);border:none;
    padding:6px 10px;border-radius:8px;font-weight:700;cursor:pointer;}
  .leaderboard .source{font-size:10px;color:rgba(255,255,255,0.45);}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div class="scene"><div class="bunting"></div></div>

    <div class="hud-top hidden" id="hud">
      <div class="team" id="teamA"><span class="flag">🇧🇷</span><span class="name">YOU</span></div>
      <div class="score-bar" id="scoreA"></div>
      <div style="color:#fff;font-weight:800;">VS</div>
      <div class="score-bar" id="scoreB"></div>
      <div class="team" id="teamB"><span class="flag">🇺🇾</span><span class="name">CPU</span></div>
    </div>
    <div class="turn-banner hidden" id="turnBanner">YOUR SHOT</div>

    <div class="pitch-area" id="pitchArea">
      <svg class="pitch" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet">
        <defs>
          <pattern id="netPat" width="14" height="14" patternUnits="userSpaceOnUse">
            <path d="M0 0 L14 14 M14 0 L0 14" stroke="rgba(255,255,255,0.55)" stroke-width="1" fill="none"/>
          </pattern>
          <linearGradient id="postGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4d4d4"/>
          </linearGradient>
        </defs>
        <rect id="goalRect" x="200" y="90" width="400" height="210" fill="url(#netPat)"/>
        <rect x="194" y="86" width="12" height="218" fill="url(#postGrad)" rx="3"/>
        <rect x="594" y="86" width="12" height="218" fill="url(#postGrad)" rx="3"/>
        <rect x="194" y="82" width="412" height="12" fill="url(#postGrad)" rx="3"/>
        <ellipse cx="400" cy="400" rx="14" ry="4" fill="rgba(255,255,255,0.85)"/>
        <g id="keeper" style="transform-origin:400px 240px;transition:transform 320ms cubic-bezier(.2,.7,.3,1);">
          <ellipse cx="400" cy="295" rx="34" ry="6" fill="rgba(0,0,0,0.3)"/>
          <rect x="386" y="240" width="10" height="50" rx="4" fill="#2a3548"/>
          <rect x="404" y="240" width="10" height="50" rx="4" fill="#2a3548"/>
          <path d="M370 185 Q400 175 430 185 L438 245 Q400 255 362 245 Z" fill="#2ecc71"/>
          <path d="M375 192 L425 192 L432 230 L368 230 Z" fill="#e23b3b" opacity="0.85"/>
          <rect x="340" y="190" width="34" height="10" rx="5" fill="#2ecc71" transform="rotate(-18 357 195)"/>
          <rect x="426" y="190" width="34" height="10" rx="5" fill="#2ecc71" transform="rotate(18 443 195)"/>
          <circle cx="338" cy="178" r="8" fill="#fff"/>
          <circle cx="462" cy="178" r="8" fill="#fff"/>
          <circle cx="400" cy="170" r="14" fill="#c08864"/>
          <path d="M388 162 Q400 152 412 162 L412 168 L388 168 Z" fill="#2a1f17"/>
        </g>
        <g id="ball" style="transform-origin:400px 400px;">
          <ellipse cx="400" cy="413" rx="16" ry="4" fill="rgba(0,0,0,0.3)"/>
          <circle cx="400" cy="400" r="18" fill="#fff" stroke="#222" stroke-width="1.5"/>
          <polygon points="400,388 408,394 405,403 395,403 392,394" fill="#222"/>
        </g>
      </svg>
      <div class="crosshair hidden" id="crosshair"></div>
    </div>

    <!-- Curve picker (vertical, left side) -->
    <div class="curve-panel hidden" id="curvePanel">
      <div class="cp-label">Curve</div>
      <!-- 5 options: hard-L, soft-L, straight, soft-R, hard-R -->
      <div class="curve-opt" data-curve="-1" title="Hard left">
        <svg width="44" height="36" viewBox="0 0 44 36">
          <path d="M34,4 Q4,18 34,32" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="curve-opt" data-curve="-0.45" title="Soft left">
        <svg width="44" height="36" viewBox="0 0 44 36">
          <path d="M32,4 Q10,18 32,32" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="curve-opt selected" data-curve="0" title="Straight">
        <svg width="44" height="36" viewBox="0 0 44 36">
          <line x1="8" y1="18" x2="36" y2="18" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="curve-opt" data-curve="0.45" title="Soft right">
        <svg width="44" height="36" viewBox="0 0 44 36">
          <path d="M12,4 Q34,18 12,32" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="curve-opt" data-curve="1" title="Hard right">
        <svg width="44" height="36" viewBox="0 0 44 36">
          <path d="M10,4 Q40,18 10,32" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Two oscillating meters (accuracy + power) -->
    <div class="meters hidden" id="meters">
      <div class="meter" id="meterAcc">
        <div class="label">Accuracy</div>
        <div class="bar-h"><div class="marker" id="markAcc" style="left:0"></div></div>
      </div>
      <div class="meter" id="meterPow">
        <div class="label">Power</div>
        <div class="bar-v"><div class="marker" id="markPow" style="bottom:0"></div></div>
      </div>
    </div>

    <div class="dive-prompt hidden" id="divePrompt">DIVE!</div>
  </div>

  <!-- setup -->
  <div class="screen" id="setupScreen">
    <div class="card">
      <h1>⚽ Penalty Shoot-out</h1>
      <div class="sub">Best of five. Don't blink.</div>
      <label>Your name</label>
      <input type="text" id="inputName" maxlength="24" placeholder="Player 1" />
      <div class="row">
        <div>
          <label>Your country</label>
          <select id="inputCountry"></select>
        </div>
        <div>
          <label>Opponent</label>
          <select id="inputOpponent"></select>
        </div>
      </div>
      <label>Difficulty</label>
      <div class="difficulty" id="difficulty">
        <button data-diff="easy">Easy</button>
        <button data-diff="medium" class="active">Medium</button>
        <button data-diff="hard">Hard</button>
      </div>
      <button class="start-btn" id="startBtn">Kick off</button>
    </div>
  </div>
</div>

<script>
const COUNTRIES=[
  ["Brazil","🇧🇷"],["Uruguay","🇺🇾"],["Argentina","🇦🇷"],["England","🏴󠁧󠁢󠁥󠁮󠁧󠁿"],
  ["France","🇫🇷"],["Germany","🇩🇪"],["Spain","🇪🇸"],["Portugal","🇵🇹"],
  ["Italy","🇮🇹"],["Netherlands","🇳🇱"],["Belgium","🇧🇪"],["Croatia","🇭🇷"],
  ["USA","🇺🇸"],["Mexico","🇲🇽"],["Canada","🇨🇦"],["Japan","🇯🇵"],
  ["South Korea","🇰🇷"],["Australia","🇦🇺"],["Senegal","🇸🇳"],["Morocco","🇲🇦"],
  ["Nigeria","🇳🇬"],["Ghana","🇬🇭"],["Cameroon","🇨🇲"],["Switzerland","🇨🇭"],
  ["Denmark","🇩🇰"],["Sweden","🇸🇪"],["Poland","🇵🇱"],["Serbia","🇷🇸"],
  ["Colombia","🇨🇴"],["Chile","🇨🇱"],["Ecuador","🇪🇨"],["Ireland","🇮🇪"],
];

const DIFF_CFG={
  easy:  {meterSpeed:0.9, keeperSkill:0.30, cpuShotErr:0.45, diveWindow:700,  winPts:1,  lossPts:-3},
  medium:{meterSpeed:1.5, keeperSkill:0.55, cpuShotErr:0.24, diveWindow:500,  winPts:2,  lossPts:-2},
  hard:  {meterSpeed:2.1, keeperSkill:0.78, cpuShotErr:0.12, diveWindow:320,  winPts:3,  lossPts:-1},
};

// SVG coordinate system
const GOAL={x:200,y:90,w:400,h:210};
const BALL_R=18; // svg units — ball must fit fully inside for a goal
const KEEPER_HOME={x:400,y:240};
const SPOT={x:400,y:400};

let state;
let meterAnim=null;

function createState(){
  return{
    name:'',flag:'🇧🇷',country:'Brazil',
    opponentFlag:'🇺🇾',opponentCountry:'Uruguay',
    difficulty:'medium',diff:DIFF_CFG.medium,
    kicks:[],turnIdx:0,teamA:0,teamB:0,
    phase:'setup',
    target:null,acc:null,pow:null,curve:0,
    cpuShotPlan:null,diveTarget:null,keeperReach:null,
    over:false,golden:false,
  };
}

// ── setup ──
function populateCountrySelects(){
  const a=document.getElementById('inputCountry');
  const b=document.getElementById('inputOpponent');
  COUNTRIES.forEach(([n,f],i)=>{
    a.insertAdjacentHTML('beforeend',`<option value="${i}" ${n==='Brazil'?'selected':''}>${f} ${n}</option>`);
    b.insertAdjacentHTML('beforeend',`<option value="${i}" ${n==='Uruguay'?'selected':''}>${f} ${n}</option>`);
  });
  const saved=JSON.parse(localStorage.getItem('penalty_profile')||'{}');
  if(saved.name) document.getElementById('inputName').value=saved.name;
  if(saved.countryIdx!=null) a.value=saved.countryIdx;
  if(saved.difficulty) document.querySelectorAll('.difficulty button').forEach(b=>b.classList.toggle('active',b.dataset.diff===saved.difficulty));
}

document.querySelectorAll('.difficulty button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.difficulty button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

document.getElementById('startBtn').addEventListener('click',()=>{
  state=createState();
  const nameRaw=document.getElementById('inputName').value.trim()||'Player 1';
  state.name=nameRaw.replace(/[\x00-\x1f]/g,'').slice(0,24);
  const ai=+document.getElementById('inputCountry').value;
  const bi=+document.getElementById('inputOpponent').value;
  [state.country,state.flag]=COUNTRIES[ai];
  [state.opponentCountry,state.opponentFlag]=COUNTRIES[bi];
  const d=document.querySelector('.difficulty button.active').dataset.diff;
  state.difficulty=d; state.diff=DIFF_CFG[d];
  localStorage.setItem('penalty_profile',JSON.stringify({name:state.name,countryIdx:ai,difficulty:d}));

  document.querySelector('#teamA .flag').textContent=state.flag;
  document.querySelector('#teamA .name').textContent=state.name.toUpperCase();
  document.querySelector('#teamB .flag').textContent=state.opponentFlag;
  document.querySelector('#teamB .name').textContent=state.opponentCountry.toUpperCase();

  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('turnBanner').classList.remove('hidden');
  renderScoreBar();
  nextTurn();
});

// ── curve picker ──
document.querySelectorAll('.curve-opt').forEach(opt=>{
  opt.addEventListener('click',e=>{
    e.stopPropagation(); // don't fire meter lock
    document.querySelectorAll('.curve-opt').forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected');
    if(state) state.curve=parseFloat(opt.dataset.curve);
  });
});

function resetCurvePicker(){
  document.querySelectorAll('.curve-opt').forEach(o=>o.classList.remove('selected'));
  document.querySelector('.curve-opt[data-curve="0"]').classList.add('selected');
  if(state) state.curve=0;
}

// ── turn flow ──
function nextTurn(){
  if(checkMatchOver()) return endMatch();
  const team=(state.turnIdx%2===0)?'A':'B';
  renderScoreBar();
  if(team==='A'){
    setBanner('YOUR SHOT — click the goal');
    state.phase='shoot_aim';
    resetCurvePicker();
    enableAim();
  } else {
    setBanner('CPU SHOOTING...');
    state.phase='keep_wait';
    // brief pause so player can see the banner before the action starts
    setTimeout(()=>startKeeperRound(),900);
  }
}

function setBanner(t){document.getElementById('turnBanner').textContent=t;}

function renderScoreBar(){
  ['A','B'].forEach(team=>{
    const el=document.getElementById('score'+team);
    el.innerHTML='';
    const kicks=state.kicks.filter(k=>k.team===team);
    const dots=Math.max(5,kicks.length);
    for(let i=0;i<dots;i++){
      const k=kicks[i];
      const cls=k?(k.goal?'goal':'miss'):'';
      el.insertAdjacentHTML('beforeend',`<div class="dot ${cls}"></div>`);
    }
  });
}

function checkMatchOver(){
  const kA=state.kicks.filter(k=>k.team==='A').length;
  const kB=state.kicks.filter(k=>k.team==='B').length;
  const remA=Math.max(0,5-kA), remB=Math.max(0,5-kB);
  const lead=Math.abs(state.teamA-state.teamB);
  if(lead>Math.max(remA,remB)) return true;
  if(kA>=5&&kB>=5){
    if(state.teamA===state.teamB){state.golden=true;return false;}
    return true;
  }
  if(state.golden&&state.turnIdx>=10&&state.turnIdx%2===0&&state.teamA!==state.teamB) return true;
  return false;
}

// ── aim ──
function enableAim(){
  const cross=document.getElementById('crosshair');
  cross.classList.remove('hidden');
  // show curve picker immediately so player can choose before clicking goal
  document.getElementById('curvePanel').classList.remove('hidden');
  const pitch=document.getElementById('pitchArea');
  const svg=pitch.querySelector('svg');

  function svgPt(e){
    const r=svg.getBoundingClientRect();
    return{x:((e.clientX-r.left)/r.width)*800,y:((e.clientY-r.top)/r.height)*450,rect:r};
  }
  function onMove(e){
    const p=svgPt(e);
    const inZone=p.x>GOAL.x-40&&p.x<GOAL.x+GOAL.w+40&&p.y>GOAL.y-40&&p.y<GOAL.y+GOAL.h+40;
    cross.style.opacity=inZone?'1':'0.25';
    cross.style.left=(e.clientX-p.rect.left)+'px';
    cross.style.top=(e.clientY-p.rect.top)+'px';
  }
  function onClick(e){
    if(e.target.closest('.curve-opt')) return; // curve pick, not aim click
    const p=svgPt(e);
    const tx=Math.max(GOAL.x+BALL_R+4,Math.min(GOAL.x+GOAL.w-BALL_R-4,p.x));
    const ty=Math.max(GOAL.y+BALL_R+4,Math.min(GOAL.y+GOAL.h-BALL_R-4,p.y));
    state.target={x:tx,y:ty};
    pitch.removeEventListener('mousemove',onMove);
    pitch.removeEventListener('click',onClick);
    cross.style.left=((tx/800)*p.rect.width)+'px';
    cross.style.top=((ty/450)*p.rect.height)+'px';
    startMeters();
  }
  pitch.addEventListener('mousemove',onMove);
  pitch.addEventListener('click',onClick);
}

// ── meters (accuracy + power only) ──
function startMeters(){
  const mEl=document.getElementById('meters');
  mEl.classList.remove('hidden');
  document.getElementById('meterAcc').classList.remove('locked');
  document.getElementById('meterPow').classList.remove('locked');
  state.acc=null; state.pow=null;
  state.phase='shoot_acc';
  setBanner('Lock ACCURACY (click)');
  const start=performance.now();
  const speed=state.diff.meterSpeed;

  if(meterAnim) cancelAnimationFrame(meterAnim);
  function tick(now){
    const t=(now-start)/1000;
    if(state.acc===null){
      const v=(Math.sin(t*2.6*speed)+1)/2;
      document.getElementById('markAcc').style.left=(v*136)+'px';
    }
    if(state.pow===null){
      const v=(Math.sin(t*2.2*speed-0.5)+1)/2;
      document.getElementById('markPow').style.bottom=(v*76)+'px';
    }
    meterAnim=requestAnimationFrame(tick);
  }
  meterAnim=requestAnimationFrame(tick);
}

function lockNextMeter(){
  if(state.phase==='shoot_acc'){
    const left=parseFloat(document.getElementById('markAcc').style.left)||0;
    state.acc=left/136;
    document.getElementById('meterAcc').classList.add('locked');
    state.phase='shoot_pow';
    setBanner('Lock POWER (click)');
  } else if(state.phase==='shoot_pow'){
    const bot=parseFloat(document.getElementById('markPow').style.bottom)||0;
    state.pow=bot/76;
    document.getElementById('meterPow').classList.add('locked');
    cancelAnimationFrame(meterAnim); meterAnim=null;
    state.phase='animating';
    setBanner('');
    executeShot();
  }
}

// global click → lock meter OR dive (mutually exclusive phases)
document.getElementById('app').addEventListener('click',e=>{
  if(!state) return;
  if(e.target.closest('#setupScreen')||e.target.closest('.curve-opt')||
     e.target.closest('.result-overlay')||e.target.closest('.leaderboard')) return;
  if(state.phase==='shoot_acc'||state.phase==='shoot_pow') lockNextMeter();
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&state&&(state.phase==='shoot_acc'||state.phase==='shoot_pow')){
    e.preventDefault(); lockNextMeter();
  }
});

// ── shoot ──
function executeShot(){
  document.getElementById('curvePanel').classList.add('hidden');
  const err=(state.acc-0.5)*2; // -1..1, 0=perfect
  const noisyX=(state.target.x-SPOT.x)+err*80;
  const noisyY=(state.target.y-SPOT.y);
  // final landing inside or outside goal depending on accuracy
  const fx=SPOT.x+noisyX;
  const fy=SPOT.y+noisyY;

  // Bézier control point — curve bends the ball sideways relative to the shot axis
  const mid={x:(SPOT.x+fx)/2,y:(SPOT.y+fy)/2};
  const perp={x:-(fy-SPOT.y),y:(fx-SPOT.x)};
  const plen=Math.hypot(perp.x,perp.y)||1;
  const ctrl={x:mid.x+(perp.x/plen)*state.curve*180,y:mid.y+(perp.y/plen)*state.curve*180};

  const duration=1500-state.pow*700; // slower: 800..1500ms
  scheduleKeeperDive({x:fx,y:fy},duration);
  animateBall(SPOT,ctrl,{x:fx,y:fy},duration,()=>resolveShot({x:fx,y:fy}));
}

function scheduleKeeperDive(target,duration){
  let reactionMs,aimX,aimY,reach;
  if(state.difficulty==='easy'){
    reactionMs=duration*0.55;
    const corners=[
      {x:GOAL.x+50,y:GOAL.y+70},{x:GOAL.x+GOAL.w-50,y:GOAL.y+70},
      {x:GOAL.x+50,y:GOAL.y+GOAL.h-50},{x:GOAL.x+GOAL.w-50,y:GOAL.y+GOAL.h-50},
    ];
    const pick=corners[Math.floor(Math.random()*4)];
    aimX=pick.x; aimY=pick.y; reach=55;
  } else if(state.difficulty==='medium'){
    reactionMs=duration*0.32;
    aimX=target.x+(Math.random()-0.5)*130; aimY=target.y+(Math.random()-0.5)*70; reach=65;
  } else {
    reactionMs=duration*0.2;
    aimX=target.x+(Math.random()-0.5)*45; aimY=target.y+(Math.random()-0.5)*28; reach=75;
  }
  setTimeout(()=>{
    const k=document.getElementById('keeper');
    const dx=aimX-KEEPER_HOME.x, dy=aimY-KEEPER_HOME.y;
    k.style.transform=`translate(${dx}px,${Math.min(25,dy)}px) rotate(${Math.max(-50,Math.min(50,dx/4.5))}deg)`;
    state.keeperReach={x:aimX,y:aimY,r:reach};
  },reactionMs);
}

function resolveShot(finalPt){
  // goal: ball centre must land fully inside the posts with ball radius margin
  const inGoal=finalPt.x>GOAL.x+BALL_R&&finalPt.x<GOAL.x+GOAL.w-BALL_R&&
                finalPt.y>GOAL.y+BALL_R&&finalPt.y<GOAL.y+GOAL.h-BALL_R;
  let saved=false;
  if(inGoal&&state.keeperReach){
    const d=Math.hypot(state.keeperReach.x-finalPt.x,state.keeperReach.y-finalPt.y);
    if(d<state.keeperReach.r) saved=true;
  }
  const goal=inGoal&&!saved;
  state.kicks.push({team:'A',goal});
  if(goal) state.teamA++;
  state.turnIdx++;
  state.keeperReach=null;
  if(goal&&state.pow>0.75) triggerShake();
  showKickFlash(goal?'⚽ GOAL!':'SAVED!',goal);
  setTimeout(resetForNext,1300);
}

// ── keeper round ──
function startKeeperRound(){
  setBanner('GET READY TO DEFEND');
  const err=state.diff.cpuShotErr;
  const tx=GOAL.x+BALL_R+8+Math.random()*(GOAL.w-BALL_R*2-16);
  const ty=GOAL.y+BALL_R+8+Math.random()*(GOAL.h-BALL_R*2-16);
  const pow=0.4+Math.random()*0.55;
  const curve=(Math.random()-0.5)*1.2*(1-err*0.4);
  const mid={x:(SPOT.x+tx)/2,y:(SPOT.y+ty)/2};
  const perp={x:-(ty-SPOT.y),y:(tx-SPOT.x)};
  const plen=Math.hypot(perp.x,perp.y)||1;
  const ctrl={x:mid.x+(perp.x/plen)*curve*180,y:mid.y+(perp.y/plen)*curve*180};
  const duration=1500-pow*700;
  state.cpuShotPlan={target:{x:tx,y:ty},ctrl,duration,pow,curve};

  const prompt=document.getElementById('divePrompt');
  prompt.textContent='GET READY...';
  prompt.classList.remove('hidden');
  setTimeout(()=>{
    prompt.textContent='DIVE!';
    setBanner('CLICK WHERE TO DIVE');
    state.phase='keep_dive';
    state.diveTarget={x:KEEPER_HOME.x,y:KEEPER_HOME.y}; // default: stay
    enableDiveClick();
    state.diveTimeout=setTimeout(()=>{
      if(state.phase==='keep_dive') executeCpuShot();
    },state.diff.diveWindow);
  },800);
}

function enableDiveClick(){
  const pitch=document.getElementById('pitchArea');
  const svg=pitch.querySelector('svg');
  function onClick(e){
    if(state.phase!=='keep_dive') return;
    const r=svg.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width)*800;
    const y=((e.clientY-r.top)/r.height)*450;
    state.diveTarget={x,y};
    clearTimeout(state.diveTimeout);
    pitch.removeEventListener('click',onClick);
    const k=document.getElementById('keeper');
    const dx=x-KEEPER_HOME.x, dy=y-KEEPER_HOME.y;
    k.style.transform=`translate(${dx}px,${Math.min(25,dy)}px) rotate(${Math.max(-50,Math.min(50,dx/4.5))}deg)`;
    executeCpuShot();
  }
  pitch.addEventListener('click',onClick);
}

function executeCpuShot(){
  document.getElementById('divePrompt').classList.add('hidden');
  state.phase='animating_keep';
  const plan=state.cpuShotPlan;
  animateBall(SPOT,plan.ctrl,plan.target,plan.duration,()=>{
    const reach=state.difficulty==='hard'?60:(state.difficulty==='medium'?70:80);
    const d=Math.hypot(state.diveTarget.x-plan.target.x,state.diveTarget.y-plan.target.y);
    const inGoal=plan.target.x>GOAL.x+BALL_R&&plan.target.x<GOAL.x+GOAL.w-BALL_R&&
                  plan.target.y>GOAL.y+BALL_R&&plan.target.y<GOAL.y+GOAL.h-BALL_R;
    const saved=d<reach||!inGoal;
    const goal=!saved;
    state.kicks.push({team:'B',goal});
    if(goal) state.teamB++;
    state.turnIdx++;
    if(goal&&plan.pow>0.75) triggerShake();
    showKickFlash(goal?'CPU SCORES!':'YOU SAVED IT!',!goal);
    setTimeout(resetForNext,1300);
  });
}

// ── ball animation ──
function bezier(p0,p1,p2,t){
  const u=1-t;
  return{x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x,y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y};
}
function animateBall(p0,p1,p2,duration,done){
  const ball=document.getElementById('ball');
  const start=performance.now();
  function step(now){
    const t=Math.min(1,(now-start)/duration);
    const p=bezier(p0,p1,p2,t);
    const scale=1+t*0.55;
    ball.style.transform=`translate(${p.x-SPOT.x}px,${p.y-SPOT.y}px) scale(${scale})`;
    if(t<1) requestAnimationFrame(step);
    else done&&done();
  }
  requestAnimationFrame(step);
}

// ── flash ──
function showKickFlash(text,positive){
  const el=document.createElement('div');
  el.className='kick-flash';
  el.style.color=positive?'#2ecc71':'#e23b3b';
  el.textContent=text;
  document.getElementById('stage').appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

function triggerShake(){
  document.body.classList.add('shake-mild');
  setTimeout(()=>document.body.classList.remove('shake-mild'),240);
}

function resetForNext(){
  cancelAnimationFrame(meterAnim); meterAnim=null;
  document.getElementById('meters').classList.add('hidden');
  document.getElementById('curvePanel').classList.add('hidden');
  document.getElementById('crosshair').classList.add('hidden');
  document.getElementById('ball').style.transform='';
  document.getElementById('keeper').style.transform='';
  state.target=state.acc=state.pow=null; state.curve=0;
  renderScoreBar();
  nextTurn();
}

// ── match end ──
function endMatch(){
  state.over=true;
  const won=state.teamA>state.teamB;
  const pts=won?state.diff.winPts:state.diff.lossPts;
  submitResult(pts,won); // fire & forget — don't block UI
  setTimeout(()=>showResult(won,pts),400);
}

function showResult(won,pts){
  const ov=document.createElement('div');
  ov.className='result-overlay';
  ov.innerHTML=`<div class="result-card">
    <h2>${won?'YOU WIN! 🏆':'YOU LOSE 💔'}</h2>
    <div>Final score: ${state.teamA} – ${state.teamB}</div>
    <div class="delta" style="color:${pts>=0?'#16a34a':'#dc2626'}">${pts>0?'+':''}${pts} points</div>
    <button id="closeRes">Show leaderboard</button>
  </div>`;
  document.getElementById('app').appendChild(ov);
  document.getElementById('closeRes').addEventListener('click',()=>{ov.remove();showLeaderboard();});
}

// ── leaderboard ──
async function submitResult(pts,won){
  const payload={name:state.name,country:state.country,pointsDelta:pts,won,difficulty:state.difficulty};
  try{
    const r=await fetch('/api/leaderboard',{method:'POST',
      headers:{'content-type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(4000)});
    if(r.ok) return;
  }catch(_){}
  const key='penalty_leaderboard_local';
  const data=JSON.parse(localStorage.getItem(key)||'{}');
  const id=`${payload.name}|${payload.country}`;
  if(!data[id]) data[id]={name:payload.name,country:payload.country,points:0,games:0};
  data[id].points+=pts; data[id].games+=1;
  localStorage.setItem(key,JSON.stringify(data));
}

async function fetchLeaderboard(){
  try{
    const r=await fetch('/api/leaderboard',{signal:AbortSignal.timeout(4000)});
    if(r.ok){const d=await r.json();return{entries:d.entries||[],source:'remote'};}
  }catch(_){}
  const data=JSON.parse(localStorage.getItem('penalty_leaderboard_local')||'{}');
  return{entries:Object.values(data).sort((a,b)=>b.points-a.points).slice(0,10),source:'local'};
}

async function showLeaderboard(){
  const{entries,source}=await fetchLeaderboard();
  const panel=document.createElement('div');
  panel.className='leaderboard';
  const rows=entries.length?entries.map((e,i)=>{
    const me=e.name===state.name&&e.country===state.country;
    const fl=(COUNTRIES.find(c=>c[0]===e.country)||['',''])[1];
    return`<tr class="${me?'me':''}"><td>${i+1}</td><td>${fl} ${esc(e.name)}</td><td class="num">${e.points}</td><td class="num">${e.games}</td></tr>`;
  }).join(''):`<tr><td colspan="4" style="opacity:0.6;padding:8px 0">No games yet — you're first!</td></tr>`;
  panel.innerHTML=`<h3>Leaderboard</h3>
    <table><thead><tr><th>#</th><th>Player</th><th>Pts</th><th>GP</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="footer"><span class="source">${source}</span><button id="lbClose">Play again</button></div>`;
  document.getElementById('app').appendChild(panel);
  document.getElementById('lbClose').addEventListener('click',()=>{
    panel.remove();
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('turnBanner').classList.add('hidden');
    document.getElementById('setupScreen').classList.remove('hidden');
  });
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

populateCountrySelects();
</script>
