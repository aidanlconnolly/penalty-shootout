<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Penalty Shoot-out</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a1a0a;user-select:none;}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;}
#stage{position:absolute;inset:0;}
body.shake #stage{animation:shake 220ms ease-out;}
@keyframes shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-3px,1px);}40%{transform:translate(3px,-1px);}60%{transform:translate(-2px,2px);}80%{transform:translate(2px,-2px);}}

/* stadium bg fills full screen */
#stadiumBg{position:absolute;inset:0;width:100%;height:100%;}

/* game SVG container — centred, keeps aspect ratio */
#pitchWrap{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(100vw, calc(100vh * 16/9));
  aspect-ratio:16/9;
}
#pitchSvg{width:100%;height:100%;display:block;overflow:visible;}

/* keeper cursor during dive phase */
#pitchWrap.keeper-mode{cursor:crosshair;}

/* HUD */
.hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:18px;z-index:10;pointer-events:none;}
.team-pill{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.55);color:#fff;padding:7px 14px;border-radius:30px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;backdrop-filter:blur(4px);}
.flag{font-size:17px;}
.dots{display:flex;gap:5px;}
.dot{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,0.3);border:2px solid rgba(0,0,0,0.3);}
.dot.g{background:#22c55e;} .dot.m{background:#e23b3b;}
.vs{color:#fff;font-weight:900;font-size:15px;}
#banner{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.65);color:#fff;padding:5px 16px;border-radius:18px;font-size:12px;letter-spacing:2px;text-transform:uppercase;z-index:10;pointer-events:none;white-space:nowrap;}

/* power meter */
#powerWrap{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);border-radius:14px;padding:10px 16px;z-index:10;pointer-events:none;text-align:center;}
#powerWrap .lbl{color:rgba(255,255,255,0.7);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
.bar-v{position:relative;width:22px;height:80px;background:linear-gradient(0deg,#a3e635 0%,#facc15 40%,#f97316 70%,#ef4444 100%);border-radius:8px;margin:0 auto;overflow:hidden;}
.bar-v .mk{position:absolute;left:-3px;right:-3px;height:4px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #000;}

/* dive instructions */
#diveHint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.72);color:#fff;padding:16px 28px;border-radius:14px;font-size:20px;font-weight:800;letter-spacing:2px;text-align:center;z-index:10;pointer-events:none;}
#diveTimer{font-size:13px;color:#facc15;margin-top:4px;letter-spacing:1px;}

/* kick flash */
.kick-flash{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:56px;font-weight:900;letter-spacing:3px;pointer-events:none;z-index:20;animation:kf 1.3s ease-out forwards;text-shadow:0 4px 24px rgba(0,0,0,0.5);}
@keyframes kf{0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}60%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(.95);}}

/* POST HIT flash */
.post-flash{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:800;color:#facc15;pointer-events:none;z-index:20;animation:kf 1s ease-out forwards;}

/* result overlay */
.res-ov{position:absolute;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:60;}
.res-card{background:#fff;color:#0a1a0a;border-radius:18px;padding:30px 36px;text-align:center;min-width:320px;box-shadow:0 30px 60px rgba(0,0,0,0.5);}
.res-card h2{margin:0 0 6px;font-size:32px;}
.res-card .delta{font-size:18px;margin:8px 0 18px;}
.res-card button{padding:10px 20px;border-radius:10px;border:none;background:#0a1a0a;color:#fff;cursor:pointer;font-weight:700;font-size:14px;}

/* leaderboard */
.lb{position:absolute;top:16px;right:16px;background:rgba(0,0,0,0.82);color:#fff;border-radius:14px;padding:14px 18px;min-width:280px;max-height:70vh;overflow:auto;z-index:65;backdrop-filter:blur(6px);animation:slin 280ms ease-out;}
@keyframes slin{from{transform:translateX(110%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.lb h3{margin:0 0 8px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#facc15;}
.lb table{width:100%;border-collapse:collapse;font-size:13px;}
.lb th,.lb td{padding:4px 6px;text-align:left;}
.lb th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.18);}
.lb td.n{text-align:right;font-variant-numeric:tabular-nums;}
.lb tr.me td{color:#facc15;font-weight:700;}
.lb .lbf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.lb .lbf button{background:#facc15;color:#0a1a0a;border:none;padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer;}
.lb .src{font-size:10px;color:rgba(255,255,255,.4);}

/* setup screen */
.setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1a3a1a,#061206);z-index:50;}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:18px;padding:32px 36px;width:420px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.card h1{margin:0 0 6px;font-size:27px;}
.card .sub{color:rgba(255,255,255,.55);font-size:13px;margin-bottom:22px;}
.card label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.55);margin-bottom:5px;}
.card input,.card select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff;font-size:15px;margin-bottom:16px;outline:none;}
.card input:focus,.card select:focus{border-color:#facc15;}
.row{display:flex;gap:12px;}.row>*{flex:1;}
.diffs{display:flex;gap:8px;margin-bottom:22px;}
.diffs button{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.2);color:#fff;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:1px;transition:all 120ms;}
.diffs button.on{background:#facc15;color:#0a1a0a;border-color:#facc15;}
.go{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#4ade80,#16a34a);color:#fff;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 16px rgba(34,197,94,.35);}
.go:hover{transform:translateY(-1px);}
.hidden{display:none!important;}
</style>
</head>

<script>
// ─── DATA ───────────────────────────────────────────────────────
const COUNTRIES=[
  ["Brazil","🇧🇷"],["Uruguay","🇺🇾"],["Argentina","🇦🇷"],["England","🏴󠁧󠁢󠁥󠁮󠁧󠁿"],
  ["France","🇫🇷"],["Germany","🇩🇪"],["Spain","🇪🇸"],["Portugal","🇵🇹"],
  ["Italy","🇮🇹"],["Netherlands","🇳🇱"],["Belgium","🇧🇪"],["Croatia","🇭🇷"],
  ["USA","🇺🇸"],["Mexico","🇲🇽"],["Canada","🇨🇦"],["Japan","🇯🇵"],
  ["South Korea","🇰🇷"],["Australia","🇦🇺"],["Senegal","🇸🇳"],["Morocco","🇲🇦"],
  ["Nigeria","🇳🇬"],["Ghana","🇬🇭"],["Switzerland","🇨🇭"],["Denmark","🇩🇰"],
  ["Sweden","🇸🇪"],["Poland","🇵🇱"],["Colombia","🇨🇴"],["Ireland","🇮🇪"],
];

const DCFG={
  easy:  {powSpeed:0.9,  keeperSkill:0.30, cpuErr:0.45, diveMs:900,  winPts:1,  lossPts:-3},
  medium:{powSpeed:1.55, keeperSkill:0.55, cpuErr:0.24, diveMs:600,  winPts:2,  lossPts:-2},
  hard:  {powSpeed:2.2,  keeperSkill:0.78, cpuErr:0.12, diveMs:380,  winPts:3,  lossPts:-1},
};

// Goal in SVG space (front face)
const GF={x:140,y:88,w:520,h:282}; // front
const GB={x:163,y:72};              // back top-left offset
const BALL_R=17;
const POST_W=13;
const SPOT={x:400,y:460};
const KBASE={x:400,y:255}; // keeper anchor (transform origin)

// ─── STATE ──────────────────────────────────────────────────────
let S;
let powAnim=null;
let diveCountdown=null;

function mkState(){
  return{
    name:'',flag:'🇧🇷',country:'Brazil',
    oppFlag:'🇺🇾',oppCountry:'Uruguay',
    diff:'medium',dc:DCFG.medium,
    kicks:[],idx:0,scoreA:0,scoreB:0,
    phase:'setup', // shoot_aim|shoot_pow|animating|keep_dive|animating_keep|over
    target:null, pow:null,
    cpuPlan:null, keeperPos:{x:KBASE.x,y:KBASE.y},
    golden:false,
  };
}

// ─── SETUP ──────────────────────────────────────────────────────
function fillSelects(){
  const a=document.getElementById('iCountry');
  const b=document.getElementById('iOpp');
  COUNTRIES.forEach(([n,f],i)=>{
    a.insertAdjacentHTML('beforeend',`<option value="${i}" ${n==='Brazil'?'selected':''}>${f} ${n}</option>`);
    b.insertAdjacentHTML('beforeend',`<option value="${i}" ${n==='Uruguay'?'selected':''}>${f} ${n}</option>`);
  });
  const sv=JSON.parse(localStorage.getItem('ps_profile')||'{}');
  if(sv.name) document.getElementById('iName').value=sv.name;
  if(sv.ci!=null) a.value=sv.ci;
  if(sv.d) document.querySelectorAll('.diffs button').forEach(b=>b.classList.toggle('on',b.dataset.d===sv.d));
}
document.querySelectorAll('.diffs button').forEach(b=>{
  b.addEventListener('click',()=>{document.querySelectorAll('.diffs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
});
document.getElementById('goBtn').addEventListener('click',()=>{
  S=mkState();
  const raw=document.getElementById('iName').value.trim()||'Player 1';
  S.name=raw.replace(/[\x00-\x1f]/g,'').slice(0,24);
  const ci=+document.getElementById('iCountry').value;
  const bi=+document.getElementById('iOpp').value;
  [S.country,S.flag]=COUNTRIES[ci];
  [S.oppCountry,S.oppFlag]=COUNTRIES[bi];
  const d=document.querySelector('.diffs button.on').dataset.d;
  S.diff=d; S.dc=DCFG[d];
  localStorage.setItem('ps_profile',JSON.stringify({name:S.name,ci,d}));

  document.querySelector('#tA .flag').textContent=S.flag;
  document.querySelector('#tA .tname').textContent=S.name.toUpperCase();
  document.querySelector('#tB .flag').textContent=S.oppFlag;
  document.querySelector('#tB .tname').textContent=S.oppCountry.toUpperCase();

  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('banner').classList.remove('hidden');
  renderDots();
  nextTurn();
});

// ─── TURN FLOW ───────────────────────────────────────────────────
function nextTurn(){
  if(matchOver()) return endMatch();
  renderDots();
  if(S.idx%2===0){ // player shoots
    setBanner('YOUR SHOT — click the goal');
    S.phase='shoot_aim';
    enableAim();
  } else {
    setBanner('CPU SHOOTING...');
    S.phase='keep_wait';
    setTimeout(startKeeperRound,900);
  }
}

function setBanner(t){document.getElementById('banner').textContent=t;}

function renderDots(){
  ['A','B'].forEach(t=>{
    const el=document.getElementById('dots'+t);
    el.innerHTML='';
    const ks=S.kicks.filter(k=>k.t===t);
    for(let i=0;i<Math.max(5,ks.length);i++){
      const k=ks[i];
      el.insertAdjacentHTML('beforeend',`<div class="dot${k?(k.g?' g':' m'):''}"></div>`);
    }
  });
}

function matchOver(){
  const kA=S.kicks.filter(k=>k.t==='A').length;
  const kB=S.kicks.filter(k=>k.t==='B').length;
  const remA=Math.max(0,5-kA), remB=Math.max(0,5-kB);
  if(Math.abs(S.scoreA-S.scoreB)>Math.max(remA,remB)) return true;
  if(kA>=5&&kB>=5){
    if(S.scoreA===S.scoreB){S.golden=true;return false;}
    return true;
  }
  if(S.golden&&S.idx>=10&&S.idx%2===0&&S.scoreA!==S.scoreB) return true;
  return false;
}

// ─── PLAYER SHOOT ────────────────────────────────────────────────
let _aimMove, _aimClick;

function enableAim(){
  const wrap=document.getElementById('pitchWrap');
  const svg=document.getElementById('pitchSvg');

  _aimMove=e=>{
    if(S.phase!=='shoot_aim') return;
  };
  _aimClick=e=>{
    if(S.phase!=='shoot_aim') return;
    const r=svg.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width)*800;
    const y=((e.clientY-r.top)/r.height)*500;
    // clamp inside goal front face with ball-radius margin
    const tx=Math.max(GF.x+BALL_R+2,Math.min(GF.x+GF.w-BALL_R-2,x));
    const ty=Math.max(GF.y+BALL_R+2,Math.min(GF.y+GF.h-BALL_R-2,y));
    S.target={x:tx,y:ty};
    wrap.removeEventListener('click',_aimClick);
    startPowerMeter();
  };
  wrap.addEventListener('click',_aimClick);
}

function startPowerMeter(){
  S.phase='shoot_pow';
  S.pow=null;
  setBanner('Lock POWER (click)');
  document.getElementById('powerWrap').classList.remove('hidden');
  document.getElementById('powMk').style.bottom='0px';
  const start=performance.now();
  const spd=S.dc.powSpeed;
  if(powAnim) cancelAnimationFrame(powAnim);
  function tick(now){
    if(S.phase!=='shoot_pow') return;
    const v=(Math.sin((now-start)/1000*2.3*spd)+1)/2;
    document.getElementById('powMk').style.bottom=(v*76)+'px';
    powAnim=requestAnimationFrame(tick);
  }
  powAnim=requestAnimationFrame(tick);
}

document.getElementById('app').addEventListener('click',e=>{
  if(!S) return;
  if(e.target.closest('#setupScreen')||e.target.closest('.res-ov')||e.target.closest('.lb')) return;
  if(S.phase==='shoot_pow'){
    const v=parseFloat(document.getElementById('powMk').style.bottom)||0;
    S.pow=v/76;
    cancelAnimationFrame(powAnim); powAnim=null;
    document.getElementById('powerWrap').classList.add('hidden');
    S.phase='animating';
    setBanner('');
    doPlayerShot();
  }
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&S&&S.phase==='shoot_pow'){e.preventDefault();document.getElementById('app').click();}
});

function doPlayerShot(){
  const fx=S.target.x, fy=S.target.y;
  const ctrl={x:fx,y:(SPOT.y+fy)/2 - 30}; // slight arc upward
  const dur=1600-S.pow*750;

  // keeper AI dive
  const dc=S.dc;
  let kx,ky,reach;
  if(S.diff==='easy'){
    const cs=[{x:GF.x+55,y:GF.y+80},{x:GF.x+GF.w-55,y:GF.y+80},{x:GF.x+55,y:GF.y+GF.h-60},{x:GF.x+GF.w-55,y:GF.y+GF.h-60}];
    const c=cs[Math.floor(Math.random()*4)]; kx=c.x; ky=c.y; reach=55;
  } else if(S.diff==='medium'){
    kx=fx+(Math.random()-.5)*150; ky=fy+(Math.random()-.5)*90; reach=65;
  } else {
    kx=fx+(Math.random()-.5)*50; ky=fy+(Math.random()-.5)*35; reach=78;
  }
  setTimeout(()=>moveKeeper(kx,ky,reach),dur*0.28);

  animBall(SPOT,ctrl,{x:fx,y:fy},dur,()=>{
    // post check
    const post=checkPost(fx,fy);
    if(post!==null){
      showFlash('🥅 POST!',null);
      setTimeout(()=>{
        const deflx=post ? fx : (fx<400?GF.x-40:GF.x+GF.w+40);
        const deflGoal=post && fy>GF.y+BALL_R && fy<GF.y+GF.h-BALL_R;
        recordKick('A',deflGoal);
        setTimeout(resetRound,900);
      },600);
      return;
    }
    const inGoal=fx>GF.x+BALL_R&&fx<GF.x+GF.w-BALL_R&&fy>GF.y+BALL_R&&fy<GF.y+GF.h-BALL_R;
    let saved=false;
    if(inGoal&&S._kr){
      saved=Math.hypot(S._kr.x-fx,S._kr.y-fy)<S._kr.r;
    }
    const goal=inGoal&&!saved;
    if(goal&&S.pow>0.78) trigShake();
    showFlash(goal?'⚽ GOAL!':'SAVED! 🧤', goal);
    recordKick('A',goal);
    setTimeout(resetRound,1300);
  });
}

function moveKeeper(kx,ky,reach){
  S._kr={x:kx,y:ky,r:reach||65};
  const dx=kx-KBASE.x, dy=ky-KBASE.y;
  const rot=Math.max(-52,Math.min(52,dx/4.2));
  const k=document.getElementById('keeper');
  k.style.transform=`translate(${dx}px,${Math.min(30,dy)}px) rotate(${rot}deg)`;
}

// ─── CPU SHOOT / PLAYER KEEPS ────────────────────────────────────
function startKeeperRound(){
  setBanner('DEFEND — MOVE KEEPER TO SAVE');
  // build cpu shot
  const tx=GF.x+BALL_R+10+Math.random()*(GF.w-BALL_R*2-20);
  const ty=GF.y+BALL_R+10+Math.random()*(GF.h-BALL_R*2-20);
  const pow=0.4+Math.random()*0.55;
  const dur=1600-pow*750;
  S.cpuPlan={target:{x:tx,y:ty},ctrl:{x:tx,y:(SPOT.y+ty)/2-30},dur};
  S._kr=null;

  // reset keeper to home, then let player drag it
  S.keeperPos={x:KBASE.x,y:KBASE.y};
  document.getElementById('keeper').style.transform='';

  S.phase='keep_dive';
  const hint=document.getElementById('diveHint');
  hint.classList.remove('hidden');
  hint.firstElementChild.textContent='MOVE KEEPER TO SAVE';

  // countdown
  const totalMs=S.dc.diveMs;
  const start=performance.now();
  diveCountdown=setInterval(()=>{
    const rem=Math.max(0,(totalMs-(performance.now()-start))/1000);
    document.getElementById('diveTimer').textContent=rem>0?rem.toFixed(1)+'s':'Shooting!';
    if(rem<=0){
      clearInterval(diveCountdown); diveCountdown=null;
      fireCpuShot();
    }
  },50);

  // enable keeper dragging
  const wrap=document.getElementById('pitchWrap');
  wrap.classList.add('keeper-mode');
  const svg=document.getElementById('pitchSvg');
  function onMove(e){
    if(S.phase!=='keep_dive') return;
    const r=svg.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width)*800;
    const y=((e.clientY-r.top)/r.height)*500;
    const kx=Math.max(GF.x+25,Math.min(GF.x+GF.w-25,x));
    const ky=Math.max(GF.y+30,Math.min(GF.y+GF.h-20,y));
    S.keeperPos={x:kx,y:ky};
    const dx=kx-KBASE.x, dy=ky-KBASE.y;
    const k=document.getElementById('keeper');
    k.style.transition='none';
    k.style.transform=`translate(${dx}px,${Math.min(30,dy)}px) rotate(${Math.max(-52,Math.min(52,dx/4.2))}deg)`;
  }
  wrap.addEventListener('mousemove',onMove);
  S._keeperCleanup=()=>{wrap.removeEventListener('mousemove',onMove);wrap.classList.remove('keeper-mode');};
}

function fireCpuShot(){
  if(S._keeperCleanup){S._keeperCleanup();S._keeperCleanup=null;}
  document.getElementById('diveHint').classList.add('hidden');
  S.phase='animating_keep';
  const plan=S.cpuPlan;
  // restore keeper transition
  document.getElementById('keeper').style.transition='';

  animBall(SPOT,plan.ctrl,plan.target,plan.dur,()=>{
    const {x:tx,y:ty}=plan.target;
    const post=checkPost(tx,ty);
    if(post!==null){
      showFlash('🥅 POST!',null);
      setTimeout(()=>{
        const deflGoal=post && ty>GF.y+BALL_R && ty<GF.y+GF.h-BALL_R;
        recordKick('B',deflGoal);
        setTimeout(resetRound,900);
      },600);
      return;
    }
    const inGoal=tx>GF.x+BALL_R&&tx<GF.x+GF.w-BALL_R&&ty>GF.y+BALL_R&&ty<GF.y+GF.h-BALL_R;
    const reach=S.diff==='hard'?62:(S.diff==='medium'?72:84);
    const d=Math.hypot(S.keeperPos.x-tx,S.keeperPos.y-ty);
    const saved=d<reach||!inGoal;
    const goal=!saved;
    showFlash(goal?'CPU SCORES!':'YOU SAVED IT! 🧤',!goal);
    recordKick('B',goal);
    setTimeout(resetRound,1300);
  });
}

// ─── POST DEFLECTION ─────────────────────────────────────────────
// returns true=deflects in, false=deflects out, null=no post hit
function checkPost(x,y){
  const inHeight=y>GF.y+BALL_R&&y<GF.y+GF.h-BALL_R;
  const inWidth=x>GF.x+BALL_R&&x<GF.x+GF.w-BALL_R;
  // left post
  if(inHeight&&Math.abs(x-(GF.x))<POST_W+8) return Math.random()<0.45; // 45% goes in
  // right post
  if(inHeight&&Math.abs(x-(GF.x+GF.w))<POST_W+8) return Math.random()<0.45;
  // crossbar
  if(inWidth&&Math.abs(y-GF.y)<POST_W+6) return Math.random()<0.3;
  return null;
}

// ─── BALL ANIMATION ──────────────────────────────────────────────
function bezier(p0,p1,p2,t){
  const u=1-t;
  return{x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x, y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y};
}

function animBall(p0,p1,p2,dur,done){
  const ball=document.getElementById('ball');
  const shadow=document.getElementById('ballShadow');
  const start=performance.now();
  // progress t: ball shrinks as it goes toward goal (perspective)
  function step(now){
    const t=Math.min(1,(now-start)/dur);
    const p=bezier(p0,p1,p2,t);
    // scale: large near spot (1.3), small deep in goal (0.5)
    const scale=1.3-t*0.65;
    const bx=p.x, by=p.y;
    ball.style.transform=`translate(${bx-SPOT.x}px,${by-SPOT.y}px) scale(${scale})`;
    // Shadow fades and shrinks
    shadow.setAttribute('cy', 472+(by-SPOT.y));
    shadow.setAttribute('cx', 400+(bx-SPOT.x));
    shadow.setAttribute('rx', 18*scale);
    shadow.setAttribute('ry', 5*scale);
    shadow.setAttribute('opacity', 0.35*(1-t*0.5));
    if(t<1) requestAnimationFrame(step);
    else done&&done();
  }
  requestAnimationFrame(step);
}

// ─── HELPERS ─────────────────────────────────────────────────────
function showFlash(txt,good){
  const el=document.createElement('div');
  el.className='kick-flash';
  el.style.color=good===null?'#facc15':(good?'#22c55e':'#ef4444');
  el.textContent=txt;
  document.getElementById('stage').appendChild(el);
  setTimeout(()=>el.remove(),1400);
}

function trigShake(){
  document.body.classList.add('shake');
  setTimeout(()=>document.body.classList.remove('shake'),240);
}

function recordKick(team,goal){
  S.kicks.push({t:team,g:goal});
  if(team==='A'&&goal) S.scoreA++;
  if(team==='B'&&goal) S.scoreB++;
  S.idx++;
  renderDots();
}

function resetRound(){
  cancelAnimationFrame(powAnim); powAnim=null;
  clearInterval(diveCountdown); diveCountdown=null;
  if(S._keeperCleanup){S._keeperCleanup();S._keeperCleanup=null;}
  document.getElementById('powerWrap').classList.add('hidden');
  document.getElementById('diveHint').classList.add('hidden');
  document.getElementById('ball').style.transform='';
  document.getElementById('keeper').style.transition='';
  document.getElementById('keeper').style.transform='';
  S._kr=null; S.target=null; S.pow=null; S.keeperPos={x:KBASE.x,y:KBASE.y};
  const shadow=document.getElementById('ballShadow');
  shadow.setAttribute('cx','400'); shadow.setAttribute('cy','472');
  shadow.setAttribute('rx','18'); shadow.setAttribute('ry','5'); shadow.setAttribute('opacity','0.35');
  nextTurn();
}

// ─── MATCH END ───────────────────────────────────────────────────
function endMatch(){
  S.phase='over';
  const won=S.scoreA>S.scoreB;
  const pts=won?S.dc.winPts:S.dc.lossPts;
  submitScore(pts,won);
  setTimeout(()=>showResult(won,pts),400);
}

function showResult(won,pts){
  const ov=document.createElement('div');
  ov.className='res-ov';
  ov.innerHTML=`<div class="res-card">
    <h2>${won?'YOU WIN! 🏆':'YOU LOSE 💔'}</h2>
    <div>Score: ${S.scoreA} – ${S.scoreB}</div>
    <div class="delta" style="color:${pts>=0?'#16a34a':'#dc2626'}">${pts>0?'+':''}${pts} pts</div>
    <button id="cRes">Show leaderboard</button>
  </div>`;
  document.getElementById('app').appendChild(ov);
  document.getElementById('cRes').addEventListener('click',()=>{ov.remove();showLB();});
}

// ─── LEADERBOARD ─────────────────────────────────────────────────
async function submitScore(pts,won){
  try{
    await fetch('/api/leaderboard',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({name:S.name,country:S.country,pointsDelta:pts,won,difficulty:S.diff}),
      signal:AbortSignal.timeout(4000)});
  }catch(_){}
  const key='ps_lb';
  const d=JSON.parse(localStorage.getItem(key)||'{}');
  const id=`${S.name}|${S.country}`;
  if(!d[id]) d[id]={name:S.name,country:S.country,pts:0,gp:0};
  d[id].pts+=pts; d[id].gp+=1;
  localStorage.setItem(key,JSON.stringify(d));
}

async function fetchLB(){
  try{
    const r=await fetch('/api/leaderboard',{signal:AbortSignal.timeout(4000)});
    if(r.ok){const d=await r.json();return{e:d.entries||[],src:'remote'};}
  }catch(_){}
  const d=JSON.parse(localStorage.getItem('ps_lb')||'{}');
  return{e:Object.values(d).sort((a,b)=>b.pts-a.pts).slice(0,10),src:'local'};
}

async function showLB(){
  const{e,src}=await fetchLB();
  const panel=document.createElement('div');
  panel.className='lb';
  const rows=e.length?e.map((r,i)=>{
    const me=r.name===S.name&&r.country===S.country;
    const fl=(COUNTRIES.find(c=>c[0]===(r.country||''))||['',''])[1];
    const pts=r.pts!=null?r.pts:r.points;
    const gp=r.gp!=null?r.gp:r.games;
    return`<tr class="${me?'me':''}"><td>${i+1}</td><td>${fl} ${esc(r.name)}</td><td class="n">${pts}</td><td class="n">${gp}</td></tr>`;
  }).join(''):`<tr><td colspan="4" style="opacity:.6;padding:8px 0">No entries yet!</td></tr>`;
  panel.innerHTML=`<h3>Leaderboard</h3>
    <table><thead><tr><th>#</th><th>Player</th><th>Pts</th><th>GP</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="lbf"><span class="src">${src}</span><button id="lbClose">Play again</button></div>`;
  document.getElementById('app').appendChild(panel);
  document.getElementById('lbClose').addEventListener('click',()=>{
    panel.remove();
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('banner').classList.add('hidden');
    document.getElementById('setupScreen').classList.remove('hidden');
  });
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ─── INIT ────────────────────────────────────────────────────────
fillSelects();
</script>
